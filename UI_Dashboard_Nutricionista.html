<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- codex-elegant: design details refined -->
  <base target="_top">
  <meta charset="UTF-8">
  <title>Dashboard Nutricionista</title>
  <style>
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f5f7fa; color: #1f2933; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 16px; color: #2f855a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #718096; margin-bottom: 10px; }
    .metric { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .metric strong { font-size: 16px; }
    .alertas { margin-top: 18px; }
    .alerta { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .alerta.warning { background: #fffbeb; border-left: 4px solid #f59e0b; color: #92400e; }
    .alerta.info { background: #eff6ff; border-left: 4px solid #3b82f6; color: #1e40af; }
    .state { text-align: center; color: #718096; padding: 40px 0; }
    .err { color: #c53030; }
  </style>


<style id="up-oracular-design-system">
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style id="cdx-border-to-color">
/* Padronização de borders → cores complementares (FROTA-20) */
input:not([type="hidden"]),
textarea,
select,
[class*="input"],
[class*="field"],
[class*="form"],
.card,
.panel,
.box,
.container,

dialog {
  border: none !important;

}

input:not([type="hidden"]),
textarea,
select {
  background-color: #20242b !important;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1) !important;
}

input:focus,
textarea:focus,
select:focus {
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1), 0 0 0 2px #e9ecf1 !important;

  <style id="fleet-mobile-wcag-aa">
    /* Contrato FROTA: ergonomia S20 e WCAG 2.1 AA. */
    html, body { max-width: 100%; overflow-x: hidden; }
    :is(button, [role="button"], input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
      min-width: 48px !important;
      min-height: 48px !important;
      touch-action: manipulation;
    }

<body>
    <main>

  <h1><i class="material-icons cdx-mi" aria-hidden="true">restaurant</i> Dashboard Nutricionista</h1>
  <div id="content"><div class="state">Carregando métricas...</div></div>

  <script>
    function n(v) { return (v === undefined || v === null) ? 0 : v; }

    function render(metricas) {
      var c = metricas.cardapiosEspeciais || {}, s = metricas.substituicoes || {},
          p = metricas.pareceres || {}, a = metricas.avaliacoes || {}, alertas = metricas.alertas || [];
      var html =
        '<div class="grid">' +
          card('Cardápios Especiais', [
            ['Pendentes', n(c.pendentes)], ['Aprovados', n(c.aprovados)], ['Total', n(c.total)]]) +
          card('Substituições', [
            ['Pendentes', n(s.pendentes)], ['Aprovadas', n(s.aprovadas)], ['Rejeitadas', n(s.rejeitadas)]]) +
          card('Pareceres', [
            ['Emitidos', n(p.emitidos)], ['No mês atual', n(p.mesAtual)]]) +
          card('Avaliações', [
            ['Realizadas', n(a.realizadas)], ['Score médio', n(a.scoreMedia)]]) +
        '</div>';
      if (alertas.length) {
        html += '<div class="alertas">';
        alertas.forEach(function (al) {
          html += '<div class="alerta ' + (al.tipo || 'info') + '">' + escapeHtml(al.mensagem || '') + '</div>';
        });
        html += '</div>';
      }
      document.getElementById('content').innerHTML = html;
    }

    function card(titulo, pares) {
      var rows = pares.map(function (kv) {
        return '<div class="metric"><span>' + escapeHtml(kv[0]) + '</span><strong>' + kv[1] + '</strong></div>';
      }).join('');
      return '<div class="card"><h2>' + escapeHtml(titulo) + '</h2>' + rows + '</div>';
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function falha(msg) {
      document.getElementById('content').innerHTML =
        '<div class="state err">Não foi possível carregar as métricas.<br>' + escapeHtml(msg || '') + '</div>';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success && res.metricas) render(res.metricas);
        else falha(res && res.error ? res.error : 'Resposta inválida do servidor.');
      })
      .withFailureHandler(function (e) { falha(e && e.message ? e.message : String(e)); })
      .obterMetricasNutricionista();
  </script>

<!-- CODEX_NOTEBOOK_GRAPH_GALLERY_V1 -->
<section class="codex-notebook-graphs" data-codex-notebook-graphs aria-live="polite">
  <style>
    .codex-notebook-graphs {
      margin: 32px 0 0;
      padding: 20px;
      border: 1px solid var(--uo-border, rgba(120,130,150,.22));
      border-radius: var(--uo-radius-group, 10px);
      background: var(--uo-panel, #20242b);
      color: var(--uo-text, #e9ecf1);
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    .codex-notebook-graphs__header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .codex-notebook-graphs__title { margin:0; font-size:1.05rem; line-height:1.3; font-weight:700; color:var(--uo-text,#e9ecf1); }
    .codex-notebook-graphs__status { margin:0; font-size:.85rem; color:var(--uo-muted,#b2b9c4); }
    .codex-notebook-graphs__grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .codex-notebook-graphs__figure { margin:0; overflow:hidden; border:1px solid var(--uo-border,#343941); border-radius:var(--uo-radius-control,8px); background:var(--uo-bg,#15171c); display:flex; flex-direction:column; }
    .codex-notebook-graphs__btn { padding:0; margin:0; border:0; background:#fff; cursor:zoom-in; line-height:0; width:100%; }
    .codex-notebook-graphs__figure img { display:block; width:100%; height:auto; }
    .codex-notebook-graphs__cap { padding:10px 12px; }
    .codex-notebook-graphs__cap-title { font-size:.9rem; font-weight:600; color:var(--uo-text,#e9ecf1); }
    .codex-notebook-graphs__cap-desc { margin-top:2px; font-size:.78rem; line-height:1.35; color:var(--uo-muted,#b2b9c4); }
    .codex-notebook-graphs__empty { padding:14px; border:1px dashed var(--uo-border,#343941); border-radius:8px; font-size:.85rem; line-height:1.5; color:var(--uo-muted,#b2b9c4); }
    .codex-notebook-graphs__empty code { background:var(--uo-bg,#15171c); padding:1px 5px; border-radius:4px; }
    .codex-notebook-graphs__lightbox { position:fixed; inset:0; z-index:2147483646; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.82); }
    .codex-notebook-graphs__lightbox.is-open { display:flex; }
    .codex-notebook-graphs__lightbox img { max-width:96vw; max-height:90vh; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .codex-notebook-graphs__close { position:absolute; top:16px; right:20px; width:40px; height:40px; border-radius:50%; border:1px solid var(--uo-border,#343941); background:var(--uo-panel,#20242b); color:var(--uo-text,#e9ecf1); font-size:22px; line-height:1; cursor:pointer; }
  </style>
  <div class="codex-notebook-graphs__header">
    <h2 class="codex-notebook-graphs__title">Gráficos da análise (notebook)</h2>
    <p class="codex-notebook-graphs__status" data-codex-graphs-status>Carregando gráficos...</p>
  </div>
  <div class="codex-notebook-graphs__grid" data-codex-graphs-grid></div>
</section>
<script>
(function () {
  var section = document.currentScript && document.currentScript.previousElementSibling;
  if (!section || !section.matches('[data-codex-notebook-graphs]')) return;
  var status = section.querySelector('[data-codex-graphs-status]');
  var grid = section.querySelector('[data-codex-graphs-grid]');

  var META = {
    '01_overview_abas': { t: 'Visão geral por aba', d: 'Volume de registros em cada aba da planilha.' },
    '02_distribuicoes_numericas': { t: 'Distribuições numéricas', d: 'Dispersão das principais métricas (boxplot).' },
    '03_top_categorias': { t: 'Top categorias', d: 'Categorias mais frequentes na aba principal.' },
    '04_serie_temporal': { t: 'Série temporal', d: 'Evolução dos registros ao longo do tempo.' }
  };
  function meta(name) {
    var key = String(name || '').toLowerCase().replace(/\.(png|jpe?g)$/, '');
    if (META[key]) return META[key];
    var pretty = key.replace(/^\d+[_-]?/, '').replace(/[_-]+/g, ' ').trim();
    pretty = pretty ? pretty.charAt(0).toUpperCase() + pretty.slice(1) : 'Gráfico';
    return { t: pretty, d: '' };
  }
  function setStatus(text) { if (status) status.textContent = text; }

  var lightbox, lightImg;
  function close() { if (lightbox) lightbox.classList.remove('is-open'); }
  function openLightbox(src, alt) {
    if (!lightbox) {
      lightbox = document.createElement('div');
      lightbox.className = 'codex-notebook-graphs__lightbox';
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'codex-notebook-graphs__close';
      btn.setAttribute('aria-label', 'Fechar'); btn.textContent = '\u00d7';
      lightImg = document.createElement('img');
      lightbox.appendChild(btn); lightbox.appendChild(lightImg);
      document.body.appendChild(lightbox);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox || e.target === btn) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }
    lightImg.src = src; lightImg.alt = alt || '';
    lightbox.classList.add('is-open');
  }

  function render(response) {
    var images = response && response.images ? response.images : [];
    grid.innerHTML = '';
    if (!images.length) {
      grid.innerHTML = '<div class="codex-notebook-graphs__empty">' +
        (response && response.message ? (response.message + ' ') : '') +
        'Ainda não há gráficos. Rode <code>populateSyntheticData()</code> e depois o ' +
        '<code>notebook.py</code> no Colab (com <code>SPREADSHEETS_ID</code> e <code>FOLDER_ID</code>).</div>';
      setStatus('Nenhum gráfico ainda.');
      return;
    }
    images.forEach(function (image) {
      var info = meta(image.name);
      var figure = document.createElement('figure');
      figure.className = 'codex-notebook-graphs__figure';
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'codex-notebook-graphs__btn'; btn.title = 'Ampliar';
      var img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async'; img.src = image.dataUrl; img.alt = info.t;
      btn.appendChild(img);
      btn.addEventListener('click', function () { openLightbox(image.dataUrl, info.t); });
      var cap = document.createElement('figcaption');
      cap.className = 'codex-notebook-graphs__cap';
      var ct = document.createElement('div');
      ct.className = 'codex-notebook-graphs__cap-title'; ct.textContent = info.t;
      cap.appendChild(ct);
      if (info.d) {
        var cd = document.createElement('div');
        cd.className = 'codex-notebook-graphs__cap-desc'; cd.textContent = info.d;
        cap.appendChild(cd);
      }
      figure.appendChild(btn); figure.appendChild(cap);
      grid.appendChild(figure);
    });
    setStatus(images.length + ' gráfico(s).');
  }

  if (!window.google || !google.script || !google.script.run) {
    setStatus('Disponível apenas no Web App publicado.');
    grid.innerHTML = '<div class="codex-notebook-graphs__empty">Os gráficos aparecem quando esta tela roda dentro do Web App publicado.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function (error) {
      setStatus(error && error.message ? error.message : 'Não foi possível carregar os gráficos.');
    })
    .getNotebookGraphImages({});
}());
</script>
<!-- /CODEX_NOTEBOOK_GRAPH_GALLERY_V1 -->
