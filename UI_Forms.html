  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * ========================================
 * AE FORMS - VALIDAÇÃO E MÁSCARAS
 * ========================================
 */
const AEForms = {
  // Máscaras disponíveis
  masks: {
    cpf: { pattern: '###.###.###-##', placeholder: '000.000.000-00' },
    cnpj: { pattern: '##.###.###/####-##', placeholder: '00.000.000/0000-00' },
    phone: { pattern: '(##) #####-####', placeholder: '(00) 00000-0000' },
    cep: { pattern: '#####-###', placeholder: '00000-000' },
    date: { pattern: '##/##/####', placeholder: 'DD/MM/AAAA' },
    currency: { prefix: 'R$ ', decimal: ',', thousands: '.', precision: 2 },
    nfKey: { pattern: '#### #### #### #### #### #### #### #### #### #### ####', placeholder: '' }
  },

  // Validadores
  validators: {
    required: (value) => {
      if (!value || (typeof value === 'string' && !value.trim())) {
        return 'Este campo é obrigatório';
      }
      return null;
    },
    
    email: (value) => {
      if (!value) return null;
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return regex.test(value) ? null : 'E-mail inválido';
    },
    
    cpf: (value) => {
      if (!value) return null;
      const cpf = value.replace(/\D/g, '');
      if (cpf.length !== 11) return 'CPF deve ter 11 dígitos';
      if (/^(\d)\1+$/.test(cpf)) return 'CPF inválido';
      
      let sum = 0, rest;
      for (let i = 1; i <= 9; i++) sum += parseInt(cpf[i-1]) * (11 - i);
      rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      if (rest !== parseInt(cpf[9])) return 'CPF inválido';
      
      sum = 0;
      for (let i = 1; i <= 10; i++) sum += parseInt(cpf[i-1]) * (12 - i);
      rest = (sum * 10) % 11;
      if (rest === 10 || rest === 11) rest = 0;
      if (rest !== parseInt(cpf[10])) return 'CPF inválido';
      
      return null;
    },
    
    cnpj: (value) => {
      if (!value) return null;
      const cnpj = value.replace(/\D/g, '');
      if (cnpj.length !== 14) return 'CNPJ deve ter 14 dígitos';
      if (/^(\d)\1+$/.test(cnpj)) return 'CNPJ inválido';
      
      let size = cnpj.length - 2;
      let numbers = cnpj.substring(0, size);
      let digits = cnpj.substring(size);
      let sum = 0, pos = size - 7;
      
      for (let i = size; i >= 1; i--) {
        sum += numbers.charAt(size - i) * pos--;
        if (pos < 2) pos = 9;
      }
      let result = sum % 11 < 2 ? 0 : 11 - sum % 11;
      if (result != digits.charAt(0)) return 'CNPJ inválido';
      
      size = size + 1;
      numbers = cnpj.substring(0, size);
      sum = 0;
      pos = size - 7;
      for (let i = size; i >= 1; i--) {
        sum += numbers.charAt(size - i) * pos--;
        if (pos < 2) pos = 9;
      }
      result = sum % 11 < 2 ? 0 : 11 - sum % 11;
      if (result != digits.charAt(1)) return 'CNPJ inválido';
      
      return null;
    },
    
    minLength: (min) => (value) => {
      if (!value) return null;
      return value.length >= min ? null : `Mínimo de ${min} caracteres`;
    },
    
    maxLength: (max) => (value) => {
      if (!value) return null;
      return value.length <= max ? null : `Máximo de ${max} caracteres`;
    },
    
    min: (minVal) => (value) => {
      if (!value) return null;
      const num = parseFloat(value.replace(/[^\d,-]/g, '').replace(',', '.'));
      return num >= minVal ? null : `Valor mínimo: ${minVal}`;
    },
    
    max: (maxVal) => (value) => {
      if (!value) return null;
      const num = parseFloat(value.replace(/[^\d,-]/g, '').replace(',', '.'));
      return num <= maxVal ? null : `Valor máximo: ${maxVal}`;
    },
    
    pattern: (regex, message) => (value) => {
      if (!value) return null;
      return regex.test(value) ? null : message;
    }
  },

  // Aplicar máscara a um input
  applyMask(input, maskType) {
    const mask = this.masks[maskType];
    if (!mask) return;

    if (maskType === 'currency') {
      this.applyCurrencyMask(input, mask);
    } else {
      this.applyPatternMask(input, mask.pattern);
    }
  },

  applyPatternMask(input, pattern) {
    input.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      let result = '';
      let valueIndex = 0;

      for (let i = 0; i < pattern.length && valueIndex < value.length; i++) {
        if (pattern[i] === '#') {
          result += value[valueIndex++];
        } else {
          result += pattern[i];
          if (value[valueIndex] === pattern[i]) valueIndex++;
        }
      }

      e.target.value = result;
      this.updateFieldState(input);
    });
  },

  applyCurrencyMask(input, config) {
    input.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (!value) {
        e.target.value = '';
        return;
      }

      value = (parseInt(value) / Math.pow(10, config.precision)).toFixed(config.precision);
      const parts = value.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, config.thousands);
      
      e.target.value = config.prefix + parts.join(config.decimal);
      this.updateFieldState(input);
    });
  },

  // Validar um campo
  validateField(input, rules = []) {
    const field = input.closest('.ae-field');
    if (!field) return true;

    const value = input.value;
    let error = null;

    for (const rule of rules) {
      const validator = typeof rule === 'function' ? rule : this.validators[rule];
      if (validator) {
        error = validator(value);
        if (error) break;
      }
    }

    this.setFieldError(field, error);
    return !error;
  },

  // Definir erro no campo
  setFieldError(field, error) {
    const errorEl = field.querySelector('.ae-field-error');
    
    if (error) {
      field.classList.add('error');
      field.classList.remove('success');
      if (errorEl) {
        errorEl.innerHTML = `<span class="material-icons">error</span>${error}`;
      }
    } else {
      field.classList.remove('error');
      if (field.querySelector('.ae-field-input')?.value) {
        field.classList.add('success');
      }
      if (errorEl) errorEl.innerHTML = '';
    }
  },

  // Atualizar estado do campo (has-value)
  updateFieldState(input) {
    if (input.value) {
      input.classList.add('has-value');
    } else {
      input.classList.remove('has-value');
    }
  },

  // Inicializar formulário
  initForm(form, config = {}) {
    const formEl = typeof form === 'string' ? document.querySelector(form) : form;
    if (!formEl) return;

    // Inicializar campos com máscaras
    formEl.querySelectorAll('[data-mask]').forEach(input => {
      this.applyMask(input, input.dataset.mask);
    });

    // Inicializar validação em tempo real
    formEl.querySelectorAll('[data-validate]').forEach(input => {
      const rules = input.dataset.validate.split(',').map(r => r.trim());
      
      input.addEventListener('blur', () => {
        this.validateField(input, rules);
      });

      input.addEventListener('input', () => {
        this.updateFieldState(input);
        // Remove erro enquanto digita
        const field = input.closest('.ae-field');
        if (field?.classList.contains('error')) {
          field.classList.remove('error');
        }
      });
    });

    // Inicializar contadores de caracteres
    formEl.querySelectorAll('[data-maxlength]').forEach(input => {
      const max = parseInt(input.dataset.maxlength);
      const counter = document.createElement('span');
      counter.className = 'ae-field-counter';
      input.closest('.ae-field')?.appendChild(counter);

      const updateCounter = () => {
        const len = input.value.length;
        counter.textContent = `${len}/${max}`;
        counter.classList.toggle('warning', len > max * 0.8);
        counter.classList.toggle('error', len > max);
      };

      input.addEventListener('input', updateCounter);
      updateCounter();
    });

    // Inicializar file upload
    formEl.querySelectorAll('.ae-file-dropzone').forEach(dropzone => {
      this.initFileUpload(dropzone);
    });

    // Validação no submit
    formEl.addEventListener('submit', (e) => {
      let isValid = true;
      
      formEl.querySelectorAll('[data-validate]').forEach(input => {
        const rules = input.dataset.validate.split(',').map(r => r.trim());
        if (!this.validateField(input, rules)) {
          isValid = false;
        }
      });

      if (!isValid) {
        e.preventDefault();
        // Scroll para o primeiro erro
        const firstError = formEl.querySelector('.ae-field.error');
        firstError?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (config.onSubmit) {
        e.preventDefault();
        if (isValid) {
          const formData = new FormData(formEl);
          const data = Object.fromEntries(formData.entries());
          config.onSubmit(data);
        }
      }
    });

    return {
      validate: () => {
        let isValid = true;
        formEl.querySelectorAll('[data-validate]').forEach(input => {
          const rules = input.dataset.validate.split(',').map(r => r.trim());
          if (!this.validateField(input, rules)) isValid = false;
        });
        return isValid;
      },
      getData: () => {
        const formData = new FormData(formEl);
        return Object.fromEntries(formData.entries());
      },
      reset: () => {
        formEl.reset();
        formEl.querySelectorAll('.ae-field').forEach(field => {
          field.classList.remove('error', 'success');
          field.querySelector('.ae-field-input')?.classList.remove('has-value');
        });
      },
      setValues: (values) => {
        Object.entries(values).forEach(([name, value]) => {
          const input = formEl.querySelector(`[name="${name}"]`);
          if (input) {
            input.value = value;
            this.updateFieldState(input);
          }
        });
      }
    };
  },

  // Inicializar file upload
  initFileUpload(dropzone) {
    const input = dropzone.querySelector('input[type="file"]');
    const fileList = dropzone.parentElement.querySelector('.ae-file-list');

    ['dragenter', 'dragover'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(event => {
      dropzone.addEventListener(event, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      this.handleFiles(files, fileList, input);
    });

    input?.addEventListener('change', (e) => {
      this.handleFiles(e.target.files, fileList, input);
    });
  },

  handleFiles(files, fileList, input) {
    if (!fileList) return;

    Array.from(files).forEach(file => {
      const item = document.createElement('div');
      item.className = 'ae-file-item';
      item.innerHTML = `
        <div class="ae-file-item-icon">
          <span class="material-icons">description</span>
        </div>
        <div class="ae-file-item-info">
          <div class="ae-file-item-name">${file.name}</div>
          <div class="ae-file-item-size">${this.formatFileSize(file.size)}</div>
        </div>
        <button type="button" class="ae-file-item-remove">
          <span class="material-icons">close</span>
        </button>
      `;

      item.querySelector('.ae-file-item-remove').addEventListener('click', () => {
        item.remove();
      });

      fileList.appendChild(item);
    });
  },

  formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  }
};

// Expor globalmente
window.AEForms = AEForms;

// Auto-inicializar formulários com data-ae-form
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-ae-form]').forEach(form => {
    AEForms.initForm(form);
  });
});
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
