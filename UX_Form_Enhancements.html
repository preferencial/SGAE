  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * Form Enhancements - Funções auxiliares
 */
const FormEnhancements = {
  // Validação em tempo real
  initValidation(formId, rules) {
    const form = document.getElementById(formId);
    if (!form) return;
    
    Object.keys(rules).forEach(fieldName => {
      const field = form.querySelector(`[name="${fieldName}"]`);
      if (!field) return;
      
      const wrapper = field.closest('.input-enhanced') || field.parentElement;
      
      field.addEventListener('blur', () => this.validateField(field, rules[fieldName], wrapper));
      field.addEventListener('input', debounce(() => this.validateField(field, rules[fieldName], wrapper), 300));
    });
    
    form.addEventListener('submit', (e) => {
      let isValid = true;
      Object.keys(rules).forEach(fieldName => {
        const field = form.querySelector(`[name="${fieldName}"]`);
        const wrapper = field?.closest('.input-enhanced') || field?.parentElement;
        if (field && !this.validateField(field, rules[fieldName], wrapper)) {
          isValid = false;
        }
      });
      
      if (!isValid) {
        e.preventDefault();
        const firstError = form.querySelector('.input-enhanced.invalid input');
        if (firstError) firstError.focus();
      }
    });
  },
  
  validateField(field, rules, wrapper) {
    const value = field.value.trim();
    let isValid = true;
    let errorMsg = '';
    
    if (rules.required && !value) {
      isValid = false;
      errorMsg = rules.requiredMsg || 'Campo obrigatório';
    } else if (rules.minLength && value.length < rules.minLength) {
      isValid = false;
      errorMsg = `Mínimo ${rules.minLength} caracteres`;
    } else if (rules.maxLength && value.length > rules.maxLength) {
      isValid = false;
      errorMsg = `Máximo ${rules.maxLength} caracteres`;
    } else if (rules.pattern && !rules.pattern.test(value)) {
      isValid = false;
      errorMsg = rules.patternMsg || 'Formato inválido';
    } else if (rules.email && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      isValid = false;
      errorMsg = 'Email inválido';
    } else if (rules.custom && !rules.custom(value)) {
      isValid = false;
      errorMsg = rules.customMsg || 'Valor inválido';
    }
    
    if (wrapper) {
      wrapper.classList.toggle('valid', isValid && value);
      wrapper.classList.toggle('invalid', !isValid && value);
      
      const errorEl = wrapper.querySelector('.field-error');
      if (errorEl) {
        errorEl.textContent = errorMsg;
        errorEl.style.display = !isValid ? 'block' : 'none';
      }
    }
    
    return isValid;
  },
  
  // Autocomplete
  initAutocomplete(inputId, options) {
    const input = document.getElementById(inputId);
    if (!input) return;
    
    const wrapper = input.closest('.autocomplete-wrapper');
    let dropdown = wrapper?.querySelector('.autocomplete-dropdown');
    
    if (!dropdown) {
      dropdown = document.createElement('div');
      dropdown.className = 'autocomplete-dropdown';
      wrapper?.appendChild(dropdown) || input.parentElement.appendChild(dropdown);
    }
    
    let highlightedIndex = -1;
    let items = [];
    
    const showDropdown = async (query) => {
      if (query.length < (options.minLength || 2)) {
        dropdown.classList.remove('open');
        return;
      }
      
      items = typeof options.source === 'function' 
        ? await options.source(query)
        : options.source.filter(item => 
            item.toLowerCase().includes(query.toLowerCase())
          );
      
      if (items.length === 0) {
        dropdown.innerHTML = '<div class="autocomplete-empty">Nenhum resultado encontrado</div>';
      } else {
        dropdown.innerHTML = items.map((item, i) => {
          const text = typeof item === 'object' ? item.label : item;
          const highlighted = text.replace(
            new RegExp(`(${query})`, 'gi'),
            '<mark>$1</mark>'
          );
          return `
            <div class="autocomplete-item" data-index="${i}">
              ${options.icon ? `<div class="icon">${options.icon}</div>` : ''}
              <div class="text">
                <div class="primary">${highlighted}</div>
                ${item.secondary ? `<div class="secondary">${item.secondary}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }
      
      dropdown.classList.add('open');
      highlightedIndex = -1;
    };
    
    input.addEventListener('input', debounce((e) => showDropdown(e.target.value), 200));
    
    input.addEventListener('keydown', (e) => {
      if (!dropdown.classList.contains('open')) return;
      
      const itemEls = dropdown.querySelectorAll('.autocomplete-item');
      
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightedIndex = Math.max(highlightedIndex - 1, 0);
      } else if (e.key === 'Enter' && highlightedIndex >= 0) {
        e.preventDefault();
        selectItem(highlightedIndex);
      } else if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
      
      itemEls.forEach((el, i) => {
        el.classList.toggle('highlighted', i === highlightedIndex);
      });
    });
    
    dropdown.addEventListener('click', (e) => {
      const item = e.target.closest('.autocomplete-item');
      if (item) {
        selectItem(parseInt(item.dataset.index));
      }
    });
    
    const selectItem = (index) => {
      const item = items[index];
      const value = typeof item === 'object' ? item.value : item;
      const label = typeof item === 'object' ? item.label : item;
      
      input.value = label;
      dropdown.classList.remove('open');
      
      if (options.onSelect) {
        options.onSelect(item);
      }
    };
    
    document.addEventListener('click', (e) => {
      if (!wrapper?.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  },
  
  // File upload
  initFileUpload(containerId, options = {}) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const input = container.querySelector('input[type="file"]');
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event => {
      container.addEventListener(event, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });
    
    ['dragenter', 'dragover'].forEach(event => {
      container.addEventListener(event, () => container.classList.add('dragover'));
    });
    
    ['dragleave', 'drop'].forEach(event => {
      container.addEventListener(event, () => container.classList.remove('dragover'));
    });
    
    container.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      this.handleFiles(files, container, options);
    });
    
    container.addEventListener('click', () => input?.click());
    
    input?.addEventListener('change', (e) => {
      this.handleFiles(e.target.files, container, options);
    });
  },
  
  handleFiles(files, container, options) {
    const maxSize = options.maxSize || 10 * 1024 * 1024; // 10MB default
    const allowedTypes = options.allowedTypes || [];
    
    Array.from(files).forEach(file => {
      if (file.size > maxSize) {
        if (typeof UX !== 'undefined') {
          UX.toast.error(`Arquivo muito grande: ${file.name}`);
        }
        return;
      }
      
      if (allowedTypes.length && !allowedTypes.includes(file.type)) {
        if (typeof UX !== 'undefined') {
          UX.toast.error(`Tipo não permitido: ${file.name}`);
        }
        return;
      }
      
      this.showFilePreview(file, container, options);
      
      if (options.onFile) {
        options.onFile(file);
      }
    });
  },
  
  showFilePreview(file, container, options) {
    const preview = document.createElement('div');
    preview.className = 'file-preview';
    preview.innerHTML = `
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-size">${this.formatFileSize(file.size)}</div>
      </div>
      <button class="file-remove" type="button">×</button>
    `;
    
    preview.querySelector('.file-remove').addEventListener('click', () => {
      preview.remove();
      if (options.onRemove) options.onRemove(file);
    });
    
    container.parentElement.appendChild(preview);
  },
  
  formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  },
  
  // Form Wizard
  initWizard(wizardId, options = {}) {
    const wizard = document.getElementById(wizardId);
    if (!wizard) return;
    
    let currentStep = 0;
    const panels = wizard.querySelectorAll('.wizard-panel');
    const steps = wizard.querySelectorAll('.wizard-step');
    const prevBtn = wizard.querySelector('.wizard-btn-prev');
    const nextBtn = wizard.querySelector('.wizard-btn-next');
    
    const updateUI = () => {
      panels.forEach((panel, i) => {
        panel.classList.toggle('active', i === currentStep);
      });
      
      steps.forEach((step, i) => {
        step.classList.remove('active', 'completed');
        if (i < currentStep) step.classList.add('completed');
        if (i === currentStep) step.classList.add('active');
      });
      
      if (prevBtn) prevBtn.disabled = currentStep === 0;
      if (nextBtn) {
        nextBtn.textContent = currentStep === panels.length - 1 ? 'Concluir' : 'Próximo';
      }
    };
    
    const goTo = (step) => {
      if (step < 0 || step >= panels.length) return;
      
      // Validar passo atual antes de avançar
      if (step > currentStep && options.validateStep) {
        if (!options.validateStep(currentStep)) return;
      }
      
      currentStep = step;
      updateUI();
      
      if (options.onStepChange) {
        options.onStepChange(currentStep);
      }
    };
    
    prevBtn?.addEventListener('click', () => goTo(currentStep - 1));
    nextBtn?.addEventListener('click', () => {
      if (currentStep === panels.length - 1) {
        if (options.onComplete) options.onComplete();
      } else {
        goTo(currentStep + 1);
      }
    });
    
    updateUI();
    
    return { goTo, getCurrentStep: () => currentStep };
  }
};

// Expor globalmente
window.FormEnhancements = FormEnhancements;

// Helper debounce
function debounce(func, wait = 300) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
