  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * Feedback Components - Funções auxiliares
 */
const FeedbackComponents = {
  // Progress bar animada
  setProgress(containerId, percentage, type = '') {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const bar = container.querySelector('.progress-bar') || container;
    bar.style.width = Math.min(100, Math.max(0, percentage)) + '%';
    
    if (type) {
      bar.className = 'progress-bar ' + type;
    }
    
    // Atualizar label se existir
    const label = container.parentElement?.querySelector('.progress-label');
    if (label) {
      label.textContent = Math.round(percentage) + '%';
    }
  },
  
  // Countdown timer
  startCountdown(containerId, targetDate, onComplete) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const update = () => {
      const now = new Date().getTime();
      const target = new Date(targetDate).getTime();
      const diff = target - now;
      
      if (diff <= 0) {
        if (onComplete) onComplete();
        return;
      }
      
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);
      
      const items = container.querySelectorAll('.countdown-value');
      if (items[0]) items[0].textContent = String(days).padStart(2, '0');
      if (items[1]) items[1].textContent = String(hours).padStart(2, '0');
      if (items[2]) items[2].textContent = String(minutes).padStart(2, '0');
      if (items[3]) items[3].textContent = String(seconds).padStart(2, '0');
      
      // Adicionar classe urgente se menos de 1 hora
      if (diff < 3600000) {
        container.classList.add('urgent');
      }
      
      requestAnimationFrame(() => setTimeout(update, 1000));
    };
    
    update();
  },
  
  // Rating stars
  initRating(containerId, initialValue = 0, onChange) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    let currentValue = initialValue;
    const stars = container.querySelectorAll('.rating-star');
    
    const updateStars = (value, isHover = false) => {
      stars.forEach((star, i) => {
        star.classList.remove('active', 'hover');
        if (i < value) {
          star.classList.add(isHover ? 'hover' : 'active');
        }
      });
    };
    
    updateStars(currentValue);
    
    if (!container.classList.contains('readonly')) {
      stars.forEach((star, i) => {
        star.addEventListener('mouseenter', () => updateStars(i + 1, true));
        star.addEventListener('mouseleave', () => updateStars(currentValue));
        star.addEventListener('click', () => {
          currentValue = i + 1;
          updateStars(currentValue);
          if (onChange) onChange(currentValue);
        });
      });
    }
    
    return {
      getValue: () => currentValue,
      setValue: (v) => { currentValue = v; updateStars(v); }
    };
  },
  
  // Inline feedback
  showInlineFeedback(containerId, message, type = 'info', duration = 5000) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    
    const feedback = document.createElement('div');
    feedback.className = `inline-feedback ${type}`;
    feedback.innerHTML = `
      <span class="icon">${icons[type]}</span>
      <span>${message}</span>
    `;
    
    container.innerHTML = '';
    container.appendChild(feedback);
    
    if (duration > 0) {
      setTimeout(() => {
        feedback.style.animation = 'fade-slide-in 0.3s ease reverse';
        setTimeout(() => feedback.remove(), 300);
      }, duration);
    }
  },
  
  // Alert banner
  showBanner(options) {
    const { type = 'info', title, message, action, containerId } = options;
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    
    const banner = document.createElement('div');
    banner.className = `alert-banner ${type}`;
    banner.innerHTML = `
      <span class="icon">${icons[type]}</span>
      <div class="content">
        ${title ? `<div class="title">${title}</div>` : ''}
        <div class="message">${message}</div>
      </div>
      ${action ? `<button class="action-btn" onclick="${action.callback}">${action.label}</button>` : ''}
      <button class="close" onclick="this.parentElement.remove()">×</button>
    `;
    
    const container = containerId ? document.getElementById(containerId) : document.body;
    container.insertBefore(banner, container.firstChild);
    
    return banner;
  },
  
  // Chips/Tags
  initChips(containerId, options = {}) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const chips = container.querySelectorAll('.chip.clickable');
    
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        if (options.multiSelect) {
          chip.classList.toggle('selected');
        } else {
          chips.forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        }
        
        if (options.onChange) {
          const selected = Array.from(container.querySelectorAll('.chip.selected'))
            .map(c => c.dataset.value || c.textContent.trim());
          options.onChange(selected);
        }
      });
    });
    
    // Remover chips
    container.querySelectorAll('.chip-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const chip = btn.closest('.chip');
        if (options.onRemove) {
          options.onRemove(chip.dataset.value || chip.textContent.trim());
        }
        chip.remove();
      });
    });
  }
};

// Expor globalmente
window.FeedbackComponents = FeedbackComponents;
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>
