  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<div class="ux-confirm-overlay" id="uxConfirmOverlay" role="dialog" aria-modal="true">
  <div class="ux-confirm-modal">

    <h3 id="uxConfirmTitle">Confirmar ação?</h3>
    <p id="uxConfirmMessage">Tem certeza que deseja continuar?</p>
    <div class="actions">
      <button class="btn btn-cancel" onclick="UX.confirm.close()">Cancelar</button>
      <button class="btn btn-danger" id="uxConfirmAction" onclick="UX.confirm.execute()">Confirmar</button>

  </div>

<div class="ux-loading-overlay" id="uxLoadingOverlay" role="status" aria-live="polite">
  <div class="ux-spinner"></div>
  <div class="ux-loading-text" id="uxLoadingText">Carregando...</div>

<script>
/**
 * UX - Sistema unificado de melhorias de UX
 * Uso:
 *   UX.toast.success('Salvo com sucesso!');
 *   UX.toast.error('Erro ao salvar');
 *   UX.confirm.show({ title: 'Excluir?', onConfirm: () => delete() });
 *   UX.loading.show('Processando...');
 *   UX.loading.hide();
 */
const UX = {
  // ========================================
  // TOAST NOTIFICATIONS
  // ========================================
  toast: {
    container: null,

    init() {
      this.container = document.getElementById('uxToastContainer');
      if (!this.container) {
        this.container = document.createElement('div');
        this.container.id = 'uxToastContainer';
        this.container.className = 'ux-toast-container';
        this.container.setAttribute('role', 'region');
        this.container.setAttribute('aria-label', 'Notificações');
        document.body.appendChild(this.container);
      }
    },

    show(message, type = 'info', duration = 5000) {
      this.init();

      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };

      const toast = document.createElement('div');
      toast.className = `ux-toast ${type}`;
      toast.setAttribute('role', 'alert');
      toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');

      toast.innerHTML = `
        <span class="icon">${icons[type] || icons.info}</span>
        <span class="message">${message}</span>
        <button class="close-btn" onclick="this.parentElement.remove()" aria-label="Fechar">×</button>
      `;

      this.container.appendChild(toast);

      // Anunciar para leitores de tela
      this.announce(message);

      if (duration > 0) {
        setTimeout(() => {
          toast.style.animation = 'ux-toast-out 0.3s ease forwards';
          setTimeout(() => toast.remove(), 300);
        }, duration);
      }

      return toast;
    },

    success(msg, duration) { return this.show(msg, 'success', duration); },
    error(msg, duration) { return this.show(msg, 'error', duration || 8000); },
    warning(msg, duration) { return this.show(msg, 'warning', duration); },
    info(msg, duration) { return this.show(msg, 'info', duration); },

    announce(message) {
      const el = document.createElement('div');
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.style.cssText = 'position:absolute;left:-9999px;';
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  },

  // ========================================
  // CONFIRMATION MODAL
  // ========================================
  confirm: {
    callback: null,

    show(options = {}) {
      const overlay = document.getElementById('uxConfirmOverlay');
      const icon = document.getElementById('uxConfirmIcon');
      const title = document.getElementById('uxConfirmTitle');
      const message = document.getElementById('uxConfirmMessage');
      const actionBtn = document.getElementById('uxConfirmAction');

      title.textContent = options.title || 'Confirmar ação?';
      message.textContent = options.message || 'Tem certeza que deseja continuar?';
      actionBtn.textContent = options.actionText || 'Confirmar';

      const type = options.type || 'danger';
      icon.className = 'icon ' + type;
      icon.textContent = type === 'warning' ? '⚠️' : type === 'info' ? 'ℹ️' : '🗑️';

      actionBtn.className = 'btn btn-' + (type === 'info' ? 'primary' : type);

      this.callback = options.onConfirm;

      overlay.classList.add('active');
      actionBtn.focus();

      // Fechar com ESC
      const escHandler = (e) => {
        if (e.key === 'Escape') {
          this.close();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);
    },

    close() {
      document.getElementById('uxConfirmOverlay').classList.remove('active');
      this.callback = null;
    },

    execute() {
      if (this.callback) this.callback();
      this.close();
    }
  },

  // ========================================
  // LOADING OVERLAY
  // ========================================
  loading: {
    show(text = 'Carregando...') {
      const overlay = document.getElementById('uxLoadingOverlay');
      const textEl = document.getElementById('uxLoadingText');
      if (overlay) {
        textEl.textContent = text;
        overlay.classList.add('active');
      }
    },

    hide() {
      const overlay = document.getElementById('uxLoadingOverlay');
      if (overlay) overlay.classList.remove('active');
    },

    // Wrapper para chamadas assíncronas
    async wrap(promise, loadingText = 'Processando...') {
      this.show(loadingText);
      try {
        const result = await promise;
        this.hide();
        return result;
      } catch (error) {
        this.hide();
        throw error;
      }
    }
  },

  // ========================================
  // HELPERS
  // ========================================

  // Debounce para inputs
  debounce(func, wait = 300) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  },

  // Confirmar antes de ação destrutiva
  confirmDelete(itemName, onConfirm) {
    this.confirm.show({
      title: `Excluir ${itemName}?`,
      message: 'Esta ação não pode ser desfeita.',
      type: 'danger',
      actionText: 'Sim, excluir',
      onConfirm
    });
  },

  // Wrapper para google.script.run com loading e feedback
  run(functionName, params, options = {}) {
    return new Promise((resolve, reject) => {
      if (options.loading !== false) {
        this.loading.show(options.loadingText || 'Processando...');
      }

      google.script.run
        .withSuccessHandler((result) => {
          this.loading.hide();
          if (result && result.success === false) {
            if (options.showError !== false) {
              this.toast.error(result.message || 'Erro ao processar');
            }
            reject(result);
          } else {
            if (options.successMessage) {
              this.toast.success(options.successMessage);
            }
            resolve(result);
          }
        })
        .withFailureHandler((error) => {
          this.loading.hide();
          if (options.showError !== false) {
            this.toast.error(error.message || 'Erro inesperado');
          }
          reject(error);
        })
        [functionName](params);
    });
  }
};

// Inicializar ao carregar
document.addEventListener('DOMContentLoaded', () => {
  UX.toast.init();
});

// Atalhos de teclado globais
document.addEventListener('keydown', (e) => {

    if (saveBtn) saveBtn.click();
  }
});

(function() {

  window.__codexSchoolCommunityUx = true;

  function ready(fn) {

      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();

        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');

      button.setAttribute('type', 'button');
    });
  });

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
