<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Header Component - Alimentação Escolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    /* ========================================
       HEADER COMPONENT - ALIMENTAÇÃO ESCOLAR
       Design System Variables
       ======================================== */
    :root {
      --ae-primary: #2E7D32;
      --ae-primary-light: #4CAF50;
      --ae-primary-dark: #1B5E20;
      --ae-secondary: #EF6C00;
      --ae-secondary-light: #FF9800;
      --ae-accent: #C62828;
      --ae-bg-main: #F1F8E9;
      --ae-bg-card: #FFFFFF;
      --ae-bg-overlay: rgba(0, 0, 0, 0.5);
      --ae-text-primary: #263238;
      --ae-text-secondary: #546E7A;
      --ae-text-light: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
      --header-height: 64px;
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--ae-bg-main);
    }

    /* ========================================
       HEADER PRINCIPAL
       ======================================== */
    .ae-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: linear-gradient(135deg, var(--ae-primary) 0%, var(--ae-primary-dark) 100%);
      color: var(--ae-text-light);
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }

    .ae-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 12px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Seção Esquerda: Menu + Logo */
    .ae-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Botão Menu Sanduíche */
    .ae-hamburger {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px;
      transition: var(--transition-fast);
    }

    .ae-hamburger:hover {
      background: rgba(255,255,255,0.2);
    }

    .ae-hamburger:active {
      transform: scale(0.95);
    }

    .ae-hamburger-line {
      width: 20px;
      height: 2px;
      background: white;
      border-radius: 1px;
      transition: var(--transition-normal);
    }

    /* Animação do hamburger para X */
    .ae-hamburger.active .ae-hamburger-line:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .ae-hamburger.active .ae-hamburger-line:nth-child(2) {
      opacity: 0;
    }

    .ae-hamburger.active .ae-hamburger-line:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Logo AE */
    .ae-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ae-logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .ae-logo-text {
      display: flex;
      flex-direction: column;
    }

    .ae-logo-main {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    .ae-logo-sub {
      font-size: 0.6rem;
      font-weight: 400;
      opacity: 0.9;
      letter-spacing: 0.5px;
    }

    /* Seção Central: Título da Página (desktop) */
    .ae-header-center {
      display: none;
      flex: 1;
      text-align: center;
    }

    @media (min-width: 768px) {
      .ae-header-center {
        display: block;
      }
    }

    .ae-page-title {
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.95;
    }

    /* Seção Direita: Ações */
    .ae-header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Botões de Ação do Header */
    .ae-header-action {
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: var(--transition-fast);
    }

    .ae-header-action:hover {
      background: rgba(255,255,255,0.15);
    }

    .ae-header-action:active {
      transform: scale(0.92);
    }

    .ae-header-action .material-icons {
      font-size: 22px;
    }

    /* Badge de Notificação */
    .ae-action-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 18px;
      height: 18px;
      background: var(--ae-accent);
      color: white;
      font-size: 10px;
      font-weight: 600;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--ae-primary);
      animation: badgePulse 2s infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Status de Conexão */
    .ae-connection {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 500;
      margin-right: 8px;
    }

    .ae-connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: var(--transition-fast);
    }

    .ae-connection.online .ae-connection-dot {
      background: #A5D6A7;
      box-shadow: 0 0 6px #A5D6A7;
    }

    .ae-connection.offline .ae-connection-dot {
      background: #FFCC80;
      box-shadow: 0 0 6px #FFCC80;
    }

    .ae-connection.syncing .ae-connection-dot {
      background: #81D4FA;
      animation: syncPulse 1s infinite;
    }

    @keyframes syncPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Avatar do Usuário */
    .ae-user-avatar {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .ae-user-avatar:hover {
      background: rgba(255,255,255,0.3);
      border-color: rgba(255,255,255,0.5);
    }

    .ae-user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .ae-user-avatar .material-icons {
      font-size: 20px;
    }

    /* ========================================
       DRAWER LATERAL (PERFIL E CONFIGURAÇÕES)
       ======================================== */
    .ae-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--ae-bg-overlay);
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-normal);
      z-index: 1100;
    }

    .ae-drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .ae-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 85%;
      max-width: 320px;
      height: 100%;
      background: var(--ae-bg-card);
      transform: translateX(-100%);
      transition: transform var(--transition-normal);
      z-index: 1101;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ae-drawer.active {
      transform: translateX(0);
    }

    /* Cabeçalho do Drawer */
    .ae-drawer-header {
      background: linear-gradient(135deg, var(--ae-primary) 0%, var(--ae-primary-dark) 100%);
      color: white;
      padding: 24px 20px;
      position: relative;
    }

    .ae-drawer-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      right: 0;
      height: 40px;
      background: inherit;
      clip-path: ellipse(60% 100% at 50% 0%);
    }

    .ae-drawer-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .ae-drawer-avatar {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .ae-drawer-avatar .material-icons {
      font-size: 36px;
    }

    .ae-drawer-user-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .ae-drawer-user-info p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .ae-drawer-user-info .ae-user-role {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-top: 8px;
    }

    /* Navegação do Drawer */
    .ae-drawer-nav {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0 16px;
    }

    .ae-drawer-section {
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .ae-drawer-section-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ae-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 16px;
    }

    .ae-drawer-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      color: var(--ae-text-primary);
      text-decoration: none;
      border-radius: 12px;
      transition: var(--transition-fast);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .ae-drawer-item:hover {
      background: var(--ae-bg-main);
    }

    .ae-drawer-item:active {
      background: #E8F5E9;
    }

    .ae-drawer-item .material-icons {
      font-size: 22px;
      color: var(--ae-text-secondary);
    }

    .ae-drawer-item.danger {
      color: var(--ae-accent);
    }

    .ae-drawer-item.danger .material-icons {
      color: var(--ae-accent);
    }

    .ae-drawer-divider {
      height: 1px;
      background: #E0E0E0;
      margin: 8px 16px;
    }

    /* Footer do Drawer */
    .ae-drawer-footer {
      padding: 16px 20px;
      border-top: 1px solid #E0E0E0;
      background: #FAFAFA;
    }

    .ae-drawer-version {
      font-size: 0.7rem;
      color: var(--ae-text-secondary);
      text-align: center;
    }

    /* ========================================
       DROPDOWN DO PERFIL (Desktop)
       ======================================== */
    .ae-profile-dropdown {
      position: absolute;
      top: calc(var(--header-height) - 4px);
      right: 12px;
      width: 280px;
      background: var(--ae-bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: var(--transition-normal);
      z-index: 1050;
      overflow: hidden;
    }

    .ae-profile-dropdown.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .ae-dropdown-header {
      background: linear-gradient(135deg, var(--ae-primary) 0%, var(--ae-primary-dark) 100%);
      color: white;
      padding: 16px;
    }

    .ae-dropdown-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ae-dropdown-avatar {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ae-dropdown-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .ae-dropdown-info p {
      font-size: 0.75rem;
      opacity: 0.9;
    }

    .ae-dropdown-body {
      padding: 8px;
    }

    .ae-dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      color: var(--ae-text-primary);
      cursor: pointer;
      transition: var(--transition-fast);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .ae-dropdown-item:hover {
      background: var(--ae-bg-main);
    }

    .ae-dropdown-item .material-icons {
      font-size: 20px;
      color: var(--ae-text-secondary);
    }

    .ae-dropdown-item.danger {
      color: var(--ae-accent);
    }

    .ae-dropdown-item.danger .material-icons {
      color: var(--ae-accent);
    }

    /* ========================================
       RESPONSIVIDADE
       ======================================== */
    @media (min-width: 768px) {
      .ae-header-inner {
        padding: 0 24px;
      }

      .ae-hamburger {
        width: 48px;
        height: 48px;
      }

      .ae-logo-main {
        font-size: 1.75rem;
      }

      .ae-logo-sub {
        font-size: 0.7rem;
      }

      .ae-header-action {
        width: 44px;
        height: 44px;
      }
    }

    /* Espaçador para conteúdo abaixo do header fixo */
    .ae-header-spacer {
      height: var(--header-height);
    }
  


/* codex-school-community-ux: ajustes finos para uso recorrente por comunidade escolar */
:root {
  --codex-school-focus: #ffd166;
  --codex-school-touch: 44px;
  --codex-school-radius: 8px;
  --codex-school-field-radius: 7px;
  --codex-school-form-gap: 14px;
  --codex-school-field-border: rgba(120, 132, 156, 0.45);
  --codex-school-field-bg: rgba(255, 255, 255, 0.96);
  --codex-school-field-text: #1f2937;
  --codex-school-muted-text: #64748b;
  --codex-school-soft-surface: rgba(248, 250, 252, 0.82);
  --codex-school-safe-bottom: max(16px, env(safe-area-inset-bottom));
}

:where(html) {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

:where(body) {
  overscroll-behavior-y: contain;
}

:where(p, li, dd, dt, blockquote, figcaption, label, td, th) {
  line-height: 1.5;
}

:where(main, .main, .content, .page, .app, .app-shell, .container, .dashboard, .workspace) {
  padding-bottom: var(--codex-school-safe-bottom);
}

:where(a, button, .btn, .button, [role="button"], input, select, textarea, summary) {
  min-height: var(--codex-school-touch);
  touch-action: manipulation;
}

:where(button, .btn, .button, [role="button"], input[type="submit"], input[type="button"]) {
  border-radius: var(--codex-school-radius) !important;
  font-weight: 700;
}

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--codex-school-focus) !important;
  outline-offset: 3px !important;
}

:where(label) {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  color: var(--codex-gentle-muted, var(--text-muted, var(--codex-school-muted-text)));
  font-weight: 700;
}

:where(form) {
  border-radius: var(--codex-school-radius) !important;
}

:where(fieldset) {
  border-radius: var(--codex-school-radius) !important;
  border-color: var(--codex-school-field-border);
}

:where(legend) {
  padding-inline: 6px;
  font-weight: 700;
}

:where(.form-group, .input-field, .field, .form-field, .control-group) {
  margin-bottom: var(--codex-school-form-gap);
}

:where(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
  width: min(100%, 100%);
  border-radius: var(--codex-school-field-radius) !important;
  border-color: var(--codex-school-field-border) !important;
  background-color: var(--input-bg, var(--field-bg, var(--codex-school-field-bg)));
  color: var(--input-text, var(--text-color, var(--codex-school-field-text)));
  font-size: 16px !important;
}

:where(input::placeholder, textarea::placeholder) {
  color: var(--placeholder-color, #94a3b8);
  opacity: 1;
}

:where(input[required], select[required], textarea[required]) {
  border-left: 3px solid var(--codex-gentle-primary-strong, #aecbfa) !important;
}

:where(input:disabled, select:disabled, textarea:disabled, button:disabled, [aria-disabled="true"]) {
  cursor: not-allowed !important;
  opacity: 0.68;
}

:where(.help, .hint, .help-text, .form-help, small) {
  line-height: 1.45;
  color: var(--codex-gentle-muted, var(--text-muted, var(--codex-school-muted-text)));
}

:where(.actions, .form-actions, .button-row, .toolbar, .topbar, nav, [role="toolbar"]) {
  gap: 8px;
}

:where(.actions, .form-actions, .button-row) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
}

:where(.actions, .form-actions, .button-row) > :where(button, .btn, .button, [role="button"]) {
  flex: 1 1 148px;
}

:where(.card, .panel, .box, .tile, .item, .list-item, .action-card) {
  border-radius: var(--codex-school-radius) !important;
}

:where(.section, .surface, .widget, .modal-content, .dialog-content, .drawer, .dropdown, .menu) {
  border-radius: var(--codex-school-radius) !important;
}

:where(.filters, .search-panel, .form-section) {
  border-radius: var(--codex-school-radius) !important;
  background: var(--codex-school-soft-surface);
}

:where(table) {
  border-collapse: collapse;
}

:where(table, .table, .data-table) {
  max-width: 100%;
}

:where(.table-wrap, .table-wrapper, .table-container, .responsive-table) {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

:where(th, td) {
  vertical-align: top;
}

:where(.toast, .alert, .notice, .snackbar, [role="status"], [role="alert"]) {
  border-radius: var(--codex-school-radius) !important;
  line-height: 1.45;
}

@media (max-width: 420px) {
  :where(body) {
    font-size: 16px;
  }

  :where(h1) {
    font-size: clamp(1.55rem, 1.35rem + 1vw, 2rem) !important;
    line-height: 1.15 !important;
  }

  :where(h2) {
    font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.55rem) !important;
    line-height: 1.2 !important;
  }

  :where(.toolbar, .topbar, nav, [role="toolbar"]) {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }

  :where(.hide-mobile, .desktop-only) {
    display: none !important;
  }
}

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

  <script>
    /**
     * ========================================
     * AE HEADER COMPONENT
     * Alimentação Escolar - CRE-PP
     * ========================================
     */
    const AEHeader = {
      // Estado
      state: {
        drawerOpen: false,
        dropdownOpen: false,
        isOnline: navigator.onLine,
        isSyncing: false,
        user: null,
        notifications: []
      },

      // Elementos DOM
      elements: {},

      // Inicialização
      init() {
        this.cacheElements();
        this.bindEvents();
        this.setupConnectionMonitor();
        this.loadUserData();
        this.loadNotifications();
      },

      // Cache de elementos
      cacheElements() {
        this.elements = {
          hamburger: document.getElementById('hamburgerBtn'),
          drawer: document.getElementById('mainDrawer'),
          overlay: document.getElementById('drawerOverlay'),
          dropdown: document.getElementById('profileDropdown'),
          avatarBtn: document.getElementById('userAvatarBtn'),
          connectionStatus: document.getElementById('connectionStatus'),
          notifBadge: document.getElementById('notifBadge'),
          pageTitle: document.getElementById('pageTitle')
        };
      },

      // Bindagem de eventos
      bindEvents() {
        // Menu hamburger
        this.elements.hamburger?.addEventListener('click', () => this.toggleDrawer());
        
        // Overlay fecha drawer
        this.elements.overlay?.addEventListener('click', () => this.closeDrawer());
        
        // Avatar abre dropdown
        this.elements.avatarBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          this.toggleDropdown();
        });
        
        // Clique fora fecha dropdown
        document.addEventListener('click', (e) => {
          if (!this.elements.dropdown?.contains(e.target) && 
              !this.elements.avatarBtn?.contains(e.target)) {
            this.closeDropdown();
          }
        });
        
        // Tecla ESC fecha tudo
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            this.closeDrawer();
            this.closeDropdown();
          }
        });

        // Botões de ação do header
        document.getElementById('btnNotifications')?.addEventListener('click', () => {
          this.emit('openDrawer', 'notifications');
        });
        
        document.getElementById('btnSearch')?.addEventListener('click', () => {
          this.emit('openDrawer', 'search');
        });
        
        document.getElementById('btnCalendar')?.addEventListener('click', () => {
          this.emit('openDrawer', 'calendar');
        });
      },

      // Toggle do drawer
      toggleDrawer() {
        this.state.drawerOpen ? this.closeDrawer() : this.openDrawer();
      },

      openDrawer() {
        this.state.drawerOpen = true;
        this.elements.drawer?.classList.add('active');
        this.elements.overlay?.classList.add('active');
        this.elements.hamburger?.classList.add('active');
        this.elements.hamburger?.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
      },

      closeDrawer() {
        this.state.drawerOpen = false;
        this.elements.drawer?.classList.remove('active');
        this.elements.overlay?.classList.remove('active');
        this.elements.hamburger?.classList.remove('active');
        this.elements.hamburger?.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      },

      // Toggle do dropdown
      toggleDropdown() {
        this.state.dropdownOpen ? this.closeDropdown() : this.openDropdown();
      },

      openDropdown() {
        this.state.dropdownOpen = true;
        this.elements.dropdown?.classList.add('active');
      },

      closeDropdown() {
        this.state.dropdownOpen = false;
        this.elements.dropdown?.classList.remove('active');
      },

      // Monitor de conexão
      setupConnectionMonitor() {
        const updateStatus = (status) => {
          const el = this.elements.connectionStatus;
          if (!el) return;
          
          el.className = `ae-connection ${status}`;
          const label = el.querySelector('.ae-connection-label');
          
          switch (status) {
            case 'online':
              if (label) label.textContent = 'Online';
              break;
            case 'offline':
              if (label) label.textContent = 'Offline';
              break;
            case 'syncing':
              if (label) label.textContent = 'Sincronizando...';
              break;
          }
          
          this.state.isOnline = status !== 'offline';
          this.state.isSyncing = status === 'syncing';
        };

        window.addEventListener('online', () => updateStatus('online'));
        window.addEventListener('offline', () => updateStatus('offline'));
        
        updateStatus(navigator.onLine ? 'online' : 'offline');
      },

      // Carregar dados do usuário
      loadUserData() {
        // Tenta cache local primeiro
        const cached = localStorage.getItem('ae_user_data');
        if (cached) {
          try {
            this.state.user = JSON.parse(cached);
            this.updateUserUI();
          } catch (e) {
            // Cache corrompido - remove e continua para buscar do servidor
            console.warn('Cache de usuário inválido, removendo:', e.message);
            localStorage.removeItem('ae_user_data');
          }
        }

        // Busca do servidor
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((data) => {
              if (data?.success && data.usuario) {
                this.state.user = data.usuario;
                localStorage.setItem('ae_user_data', JSON.stringify(data.usuario));
                this.updateUserUI();
              }
            })
            .withFailureHandler(() => {})
            .api_getUsuarioLogado();
        }
      },

      // Atualizar UI com dados do usuário
      updateUserUI() {
        const user = this.state.user;
        if (!user) return;

        // Drawer
        const drawerName = document.getElementById('drawerUserName');
        const drawerEmail = document.getElementById('drawerUserEmail');
        if (drawerName) drawerName.textContent = user.nome || 'Usuário';
        if (drawerEmail) drawerEmail.textContent = user.email || '';

        // Dropdown
        const dropdownName = document.getElementById('dropdownUserName');
        const dropdownRole = document.getElementById('dropdownUserRole');
        if (dropdownName) dropdownName.textContent = user.nome || 'Usuário';
        if (dropdownRole) dropdownRole.textContent = `${user.perfil || 'Perfil'} • CRE-PP`;
      },

      // Carregar notificações
      loadNotifications() {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((data) => {
              if (data?.success) {
                this.state.notifications = data.notificacoes || [];
                this.updateNotificationBadge();
              }
            })
            .withFailureHandler(() => {})
            .api_getNotificacoes?.();
        }
      },

      // Atualizar badge de notificações
      updateNotificationBadge() {
        const badge = this.elements.notifBadge;
        if (!badge) return;

        const count = this.state.notifications.filter(n => !n.lida).length;
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      },

      // Definir título da página
      setPageTitle(title) {
        if (this.elements.pageTitle) {
          this.elements.pageTitle.textContent = title;
        }
      },

      // Navegação
      navigate(page) {
        this.closeDrawer();
        this.closeDropdown();
        this.emit('navigate', page);
        
        if (typeof google !== 'undefined' && google.script) {
          const funcMap = {
            'perfil': 'abrirPerfil',
            'trocar-senha': 'abrirTrocarSenha',
            'preferencias': 'abrirPreferencias',
            'configuracoes': 'abrirConfiguracoes',
            'sincronizacao': 'abrirSincronizacao',
            'historico': 'abrirHistorico',
            'offline-data': 'abrirDadosOffline',
            'ajuda': 'abrirAjuda',
            'tutorial': 'abrirTutorial',
            'sobre': 'abrirSobre'
          };
          
          const func = funcMap[page];
          if (func && google.script.run[func]) {
            google.script.run[func]();
          }
        }
      },

      // Logout
      logout() {
        if (confirm('Deseja realmente sair do sistema?')) {
          localStorage.removeItem('ae_user_data');
          localStorage.removeItem('ae_session');

          // SEMPRE retornar para a tela de login: fechar o host e no-op em web
          // app, entao recarregamos na URL absoluta do deployment (a sessao ja
          // foi limpa, logo o SPA mostra o login).
          function irParaLogin() {
            google.script.run
              .withSuccessHandler(function(url) { window.top.location.href = url || ""; })
              .withFailureHandler(function() { if (window.top) window.top.location.reload(); })
              .getScriptUrl();
          }
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(irParaLogin)
              .withFailureHandler(irParaLogin)
              .api_logout();
          } else {
            irParaLogin();
          }
        }
      },

      // Sistema de eventos
      listeners: {},
      
      on(event, callback) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(callback);
      },

      emit(event, data) {
        (this.listeners[event] || []).forEach(cb => cb(data));
      }
    };

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => AEHeader.init());

    // Expor globalmente
    window.AEHeader = AEHeader;
  </script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
