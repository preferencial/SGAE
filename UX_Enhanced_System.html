  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<style>
/* ========================================

:root {

  /* Durações padronizadas */
  --duration-instant: 100ms;
  --duration-fast: 200ms;
  --duration-normal: 300ms;

  /* Z-index layers */

/* ========================================
   MICRO-INTERAÇÕES
   ======================================== */

/* Ripple effect para botões */
.ripple {
  position: relative;
  overflow: hidden;
}

.ripple::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10.01%);
  background-repeat: no-repeat;
  background-position: 50%;
  transform: scale(10, 10);
  opacity: 0;
  transition: transform 0.5s, opacity 0.8s;
}

.ripple:active::after {
  transform: scale(0, 0);
  opacity: 0.3;
  transition: 0s;
}

/* Pulse animation para elementos importantes */
@keyframes attention-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
  50% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); }
}

.attention {
  animation: attention-pulse 2s infinite;
}

/* Shake para erros */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

.shake {
  animation: shake 0.5s ease-in-out;
}

/* Success checkmark animation */
@keyframes checkmark {
  0% { stroke-dashoffset: 100; }
  100% { stroke-dashoffset: 0; }
}

.success-checkmark {
  width: 56px;
  height: 56px;
}

.success-checkmark circle {
  fill: var(--success, #48bb78);
}

.success-checkmark path {
  stroke: white;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: checkmark 0.5s ease-out 0.2s forwards;
}

/* Hover lift effect */
.hover-lift {
  transition: transform var(--duration-fast) var(--ease-smooth),
              box-shadow var(--duration-fast) var(--ease-smooth);
}

.hover-lift:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
}

/* Scale on press */
.press-scale {
  transition: transform var(--duration-instant) var(--ease-smooth);
}

.press-scale:active {
  transform: scale(0.95);
}

/* ========================================
   SISTEMA DE ONBOARDING/TUTORIAL
   ======================================== */
.onboarding-overlay {

  opacity: 0;

.onboarding-spotlight {

.onboarding-tooltip {

  max-width: 320px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  z-index: var(--z-tooltip);
  animation: tooltip-appear var(--duration-normal) var(--ease-spring);
}

@keyframes tooltip-appear {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.onboarding-tooltip::before {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  background: white;
  transform: rotate(45deg);
}

.onboarding-tooltip.top::before {

.onboarding-tooltip.bottom::before {

          <div class="shortcut-keys"><span class="key">Shift</span><span class="key">Tab</span></div>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-label">Fechar modal</span>
          <div class="shortcut-keys"><span class="key">Esc</span></div>
        </div>
      </div>

<script>
/**
 * UXEnhanced - Sistema avançado de UX
 */
const UXEnhanced = {
  // ========================================
  // MICRO-INTERAÇÕES
  // ========================================
  micro: {
    // Adiciona efeito ripple a um elemento
    addRipple(element) {
      element.classList.add('ripple');
    },
    
    // Shake para indicar erro
    shake(element) {
      element.classList.add('shake');
      setTimeout(() => element.classList.remove('shake'), 500);
    },
    
    // Pulse para chamar atenção
    pulse(element, duration = 3000) {
      element.classList.add('attention');
      if (duration > 0) {
        setTimeout(() => element.classList.remove('attention'), duration);
      }
    },
    
    // Feedback háptico (se disponível)
    haptic(type = 'light') {
      if ('vibrate' in navigator) {
        const patterns = {
          light: [10],
          medium: [20],
          heavy: [30],
          success: [10, 50, 10],
          error: [50, 30, 50, 30, 50]
        };
        navigator.vibrate(patterns[type] || patterns.light);
      }
    },
    
    // Animação de sucesso
    showSuccess(container) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'success-checkmark');
      svg.setAttribute('viewBox', '0 0 56 56');
      svg.innerHTML = `
        <circle cx="28" cy="28" r="28"/>
        <path d="M16 28l8 8 16-16" fill="none"/>
      `;
      container.innerHTML = '';
      container.appendChild(svg);
    }
  },
  
  // ========================================
  // SISTEMA DE ONBOARDING
  // ========================================
  onboarding: {
    steps: [],
    currentStep: 0,
    isActive: false,
    
    // Definir passos do tutorial
    define(steps) {
      this.steps = steps;
      return this;
    },
    
    // Iniciar tutorial
    start() {
      if (this.steps.length === 0) return;
      
      this.currentStep = 0;
      this.isActive = true;
      document.getElementById('onboardingOverlay').classList.add('active');
      this.showStep(0);
      
      // Salvar que usuário iniciou onboarding
      localStorage.setItem('uniae_onboarding_started', 'true');
    },
    
    // Mostrar passo específico
    showStep(index) {
      const step = this.steps[index];
      if (!step) return;
      
      const target = document.querySelector(step.target);
      if (!target) {
        this.next();
        return;
      }
      
      // Posicionar spotlight
      const rect = target.getBoundingClientRect();
      const spotlight = document.getElementById('onboardingSpotlight');
      spotlight.style.top = (rect.top - 8) + 'px';
      spotlight.style.left = (rect.left - 8) + 'px';
      spotlight.style.width = (rect.width + 16) + 'px';
      spotlight.style.height = (rect.height + 16) + 'px';
      
      // Posicionar tooltip
      const tooltip = document.getElementById('onboardingTooltip');
      tooltip.style.display = 'block';
      document.getElementById('onboardingTitle').textContent = step.title;
      document.getElementById('onboardingText').textContent = step.text;
      
      // Posição do tooltip
      this.positionTooltip(tooltip, rect, step.position || 'bottom');
      
      // Indicadores de passo
      this.renderStepIndicators();
      
      // Atualizar botão
      const nextBtn = tooltip.querySelector('.onboarding-btn-next');
      nextBtn.textContent = index === this.steps.length - 1 ? 'Concluir' : 'Próximo';
      
      // Scroll para elemento se necessário
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    
    positionTooltip(tooltip, targetRect, position) {
      const gap = 16;
      tooltip.className = 'onboarding-tooltip ' + position;
      
      switch(position) {
        case 'top':
          tooltip.style.top = (targetRect.top - tooltip.offsetHeight - gap) + 'px';
          tooltip.style.left = (targetRect.left + targetRect.width/2 - tooltip.offsetWidth/2) + 'px';
          break;
        case 'bottom':
          tooltip.style.top = (targetRect.bottom + gap) + 'px';
          tooltip.style.left = (targetRect.left + targetRect.width/2 - tooltip.offsetWidth/2) + 'px';
          break;
        case 'left':
          tooltip.style.top = (targetRect.top + targetRect.height/2 - tooltip.offsetHeight/2) + 'px';
          tooltip.style.left = (targetRect.left - tooltip.offsetWidth - gap) + 'px';
          break;
        case 'right':
          tooltip.style.top = (targetRect.top + targetRect.height/2 - tooltip.offsetHeight/2) + 'px';
          tooltip.style.left = (targetRect.right + gap) + 'px';
          break;
      }
    },
    
    renderStepIndicators() {
      const container = document.getElementById('onboardingSteps');
      container.innerHTML = this.steps.map((_, i) => 
        `<div class="onboarding-dot ${i === this.currentStep ? 'active' : ''}"></div>`
      ).join('');
    },
    
    next() {
      this.currentStep++;
      if (this.currentStep >= this.steps.length) {
        this.complete();
      } else {
        this.showStep(this.currentStep);
      }
    },
    
    skip() {
      this.complete();
      localStorage.setItem('uniae_onboarding_skipped', 'true');
    },
    
    complete() {
      this.isActive = false;
      document.getElementById('onboardingOverlay').classList.remove('active');
      document.getElementById('onboardingTooltip').style.display = 'none';
      localStorage.setItem('uniae_onboarding_completed', 'true');
      
      // Callback de conclusão
      if (this.onComplete) this.onComplete();
    },
    
    // Verificar se deve mostrar onboarding
    shouldShow() {
      return false; // Onboarding desativado
    },
    
    // Reset para testes
    reset() {
      localStorage.removeItem('uniae_onboarding_completed');
      localStorage.removeItem('uniae_onboarding_skipped');
      localStorage.removeItem('uniae_onboarding_started');
    }
  },
  
  // ========================================
  // NOTIFICAÇÕES EM TEMPO REAL
  // ========================================
  notifications: {
    items: [],
    unreadCount: 0,
    panel: null,
    
    init() {
      // Criar painel se não existir
      if (!document.getElementById('notificationPanel')) {
        this.createPanel();
      }
      this.panel = document.getElementById('notificationPanel');
    },
    
    createPanel() {
      const html = `
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-header">
            <h3>Notificações</h3>
            <button class="notification-mark-read" onclick="UXEnhanced.notifications.markAllRead()">
              Marcar todas como lidas
            </button>
          </div>
          <div class="notification-list" id="notificationList"></div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    },
    
    add(notification) {
      const item = {
        id: Date.now(),
        type: notification.type || 'info',
        title: notification.title,
        text: notification.text,
        time: new Date(),
        read: false,
        action: notification.action
      };
      
      this.items.unshift(item);
      this.unreadCount++;
      this.render();
      this.updateBadge();
      
      // Mostrar toast também
      if (notification.showToast !== false && typeof UX !== 'undefined') {
        UX.toast[item.type](item.title);
      }
      
      return item.id;
    },
    
    render() {
      const list = document.getElementById('notificationList');
      if (!list) return;
      
      if (this.items.length === 0) {
        list.innerHTML = `
          <div style="padding:40px;text-align:center;color:var(--gray-500);">
            <div style="font-size:32px;margin-bottom:8px;">🔔</div>
            <p>Nenhuma notificação</p>
          </div>
        `;
        return;
      }
      
      list.innerHTML = this.items.slice(0, 20).map(item => `
        <div class="notification-item ${item.read ? '' : 'unread'}" 
             onclick="UXEnhanced.notifications.handleClick(${item.id})">
          <div class="notification-icon ${item.type}">
            ${this.getIcon(item.type)}
          </div>
          <div class="notification-content">
            <div class="notification-title">${item.title}</div>
            <div class="notification-text">${item.text || ''}</div>
            <div class="notification-time">${this.formatTime(item.time)}</div>
          </div>
        </div>
      `).join('');
    },
    
    getIcon(type) {
      const icons = { info: 'ℹ️', success: '✅', warning: '⚠️', error: '❌' };
      return icons[type] || icons.info;
    },
    
    formatTime(date) {
      const now = new Date();
      const diff = Math.floor((now - date) / 1000);
      
      if (diff < 60) return 'Agora';
      if (diff < 3600) return `${Math.floor(diff/60)} min atrás`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
      return date.toLocaleDateString('pt-BR');
    },
    
    handleClick(id) {
      const item = this.items.find(i => i.id === id);
      if (!item) return;
      
      if (!item.read) {
        item.read = true;
        this.unreadCount--;
        this.updateBadge();
        this.render();
      }
      
      if (item.action) item.action();
    },
    
    markAllRead() {
      this.items.forEach(item => item.read = true);
      this.unreadCount = 0;
      this.updateBadge();
      this.render();
    },
    
    updateBadge() {
      const badges = document.querySelectorAll('.notification-badge');
      badges.forEach(badge => {
        badge.textContent = this.unreadCount;
        badge.style.display = this.unreadCount > 0 ? 'flex' : 'none';
      });
    },
    
    toggle() {
      if (this.panel) {
        this.panel.classList.toggle('open');
      }
    },
    
    close() {
      if (this.panel) {
        this.panel.classList.remove('open');
      }
    }
  },
  
  // ========================================
  // CONEXÃO/OFFLINE
  // ========================================
  connection: {
    isOnline: navigator.onLine,
    pendingActions: [],
    
    init() {
      window.addEventListener('online', () => this.handleOnline());
      window.addEventListener('offline', () => this.handleOffline());
      
      // Verificar periodicamente
      setInterval(() => this.check(), 30000);
    },
    
    handleOnline() {
      this.isOnline = true;
      this.hideStatus();
      this.syncPending();
      UXEnhanced.announce('Conexão restaurada');
    },
    
    handleOffline() {
      this.isOnline = false;
      this.showStatus('offline', 'Você está offline. Algumas ações podem não funcionar.');
      UXEnhanced.announce('Você está offline');
    },
    
    showStatus(type, message) {
      const status = document.getElementById('connectionStatus');
      if (status) {
        status.className = 'connection-status ' + type;
        status.querySelector('.text').textContent = message;
      }
    },
    
    hideStatus() {
      const status = document.getElementById('connectionStatus');
      if (status) {
        status.className = 'connection-status';
      }
    },
    
    check() {
      // Ping simples para verificar conexão real
      fetch('/ping', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          if (!this.isOnline) this.handleOnline();
        })
        .catch(() => {
          if (this.isOnline) this.handleOffline();
        });
    },
    
    // Salvar ação para sync posterior
    queueAction(action) {
      this.pendingActions.push({
        ...action,
        timestamp: Date.now()
      });
      localStorage.setItem('uniae_pending_actions', JSON.stringify(this.pendingActions));
    },
    
    // Sincronizar ações pendentes
    async syncPending() {
      const pending = JSON.parse(localStorage.getItem('uniae_pending_actions') || '[]');
      if (pending.length === 0) return;
      
      this.showStatus('syncing', 'Sincronizando dados...');
      
      for (const action of pending) {
        try {
          await this.executeAction(action);
        } catch (e) {
          console.error('Erro ao sincronizar:', e);
        }
      }
      
      localStorage.removeItem('uniae_pending_actions');
      this.pendingActions = [];
      this.hideStatus();
    },
    
    async executeAction(action) {
      // Implementar execução baseada no tipo de ação
      return new Promise((resolve, reject) => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [action.function](action.params);
        } else {
          resolve();
        }
      });
    }
  },
  
  // ========================================
  // ATALHOS DE TECLADO
  // ========================================
  shortcuts: {
    registered: {},
    
    init() {
      document.addEventListener('keydown', (e) => this.handle(e));
    },
    
    register(combo, callback, description) {
      this.registered[combo] = { callback, description };
    },
    
    handle(e) {
      // Ignorar se estiver em input
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
        if (e.key !== 'Escape') return;
      }
      
      const combo = this.getCombo(e);
      
      // Mostrar modal de atalhos com ?
      if (e.key === '?' && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        this.show();
        return;
      }
      
      // Executar atalho registrado
      if (this.registered[combo]) {
        e.preventDefault();
        this.registered[combo].callback();
      }
    },
    
    getCombo(e) {
      const parts = [];
      if (e.ctrlKey) parts.push('Ctrl');
      if (e.altKey) parts.push('Alt');
      if (e.shiftKey) parts.push('Shift');
      parts.push(e.key.toUpperCase());
      return parts.join('+');
    },
    
    show() {
      document.getElementById('shortcutsModal').classList.add('active');
    },
    
    hide() {
      document.getElementById('shortcutsModal').classList.remove('active');
    }
  },
  
  // ========================================
  // ACESSIBILIDADE
  // ========================================
  
  // Anunciar para leitores de tela
  announce(message, priority = 'polite') {
    const region = document.getElementById('uxLiveRegion');
    if (region) {
      region.setAttribute('aria-live', priority);
      region.textContent = message;
      setTimeout(() => region.textContent = '', 1000);
    }
  },
  
  // Trap de foco em modal
  trapFocus(element) {
    const focusableElements = element.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    const firstFocusable = focusableElements[0];
    const lastFocusable = focusableElements[focusableElements.length - 1];
    
    element.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      
      if (e.shiftKey) {
        if (document.activeElement === firstFocusable) {
          lastFocusable.focus();
          e.preventDefault();
        }
      } else {
        if (document.activeElement === lastFocusable) {
          firstFocusable.focus();
          e.preventDefault();
        }
      }
    });
    
    firstFocusable?.focus();
  },
  
  // ========================================
  // INICIALIZAÇÃO
  // ========================================
  init() {
    this.shortcuts.init();
    this.connection.init();
    this.notifications.init();
    
    // Registrar atalhos padrão
    this.shortcuts.register('Alt+N', () => {
      if (typeof openModal === 'function') openModal('nova-nf');
    }, 'Nova Nota Fiscal');
    
    this.shortcuts.register('Alt+D', () => {
      if (typeof navigateTo === 'function') navigateTo('dashboard');
    }, 'Ir para Dashboard');
    
    this.shortcuts.register('Ctrl+K', () => {
      const searchInput = document.querySelector('[type="search"], .search-input, #searchNF');
      if (searchInput) searchInput.focus();
    }, 'Buscar');
    
    this.shortcuts.register('ESCAPE', () => {
      // Fechar modais
      document.querySelectorAll('.modal-overlay.active, .ux-confirm-overlay.active').forEach(m => {
        m.classList.remove('active');
      });
      this.shortcuts.hide();
      this.notifications.close();
    }, 'Fechar');
    
    // Auto-iniciar onboarding para novos usuários
    if (this.onboarding.shouldShow()) {
      setTimeout(() => {
        this.onboarding.define([
          {
            target: '.sidebar-logo',
            title: 'Bem-vindo ao UNIAE! 👋',
            text: 'Este é o sistema de gestão de alimentação escolar. Vamos fazer um tour rápido.',
            position: 'right'
          },
          {
            target: '.quick-actions .action-card:first-child',
            title: 'Ações Rápidas',
            text: 'Aqui você encontra as principais ações do sistema. Clique para executar rapidamente.',
            position: 'bottom'
          },
          {
            target: '.stats-grid',
            title: 'Visão Geral',
            text: 'Acompanhe os números importantes do sistema em tempo real.',
            position: 'bottom'
          },
          {
            target: '.sidebar-nav',
            title: 'Menu de Navegação',
            text: 'Use o menu lateral para acessar todas as funcionalidades do sistema.',
            position: 'right'
          }
        ]).start();
      }, 2000);
    }
    
    console.log('✅ UXEnhanced inicializado');
  }
};

// Auto-inicializar
document.addEventListener('DOMContentLoaded', () => UXEnhanced.init());

// Helpers globais
function debounce(func, wait = 300) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

function throttle(func, limit = 100) {
  let inThrottle;
  return function(...args) {
    if (!inThrottle) {
      func.apply(this, args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
}
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
