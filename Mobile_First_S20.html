  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {

.menu-item, [class*="button"], [class*="dropdown-item"] {

  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);

  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;

}

  cursor: progress;

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

.m-select {

.m-fab {

/* FAB Mini */
.m-fab-mini {

}

/* ========================================
   TOAST MOBILE
   ======================================== */
.m-toast {
  position: fixed;
  bottom: calc(var(--m-bottom-nav-height) + var(--m-safe-bottom) + var(--m-space-lg));
  left: var(--m-space-md);
  right: var(--m-space-md);

.m-toast.warning { background: var(--m-warning); color: var(--m-text); }

/* ========================================

}

.m-sheet-title {

}

   LOADING MOBILE
   ======================================== */
.m-loading {

.m-spinner {

.m-loading-text {

}

/* ========================================

   ======================================== */
.m-pull-indicator {
  position: fixed;

<!-- Bottom Sheet Overlay -->
<div class="m-sheet-overlay" id="mSheetOverlay">
  <div class="m-sheet" id="mSheet">
    <div class="m-sheet-handle"></div>
    <div class="m-sheet-header">
      <h3 class="m-sheet-title" id="mSheetTitle">Título</h3>
      <button class="m-icon-btn" onclick="MobileS20.closeSheet()">✕</button>
    </div>
    <div class="m-sheet-body" id="mSheetBody"></div>
  </div>
</div>

<script>
/**
 * MobileS20 - Sistema Mobile otimizado para Samsung S20 + Lemur Browser
 */
const MobileS20 = {
  // ========================================
  // CONFIGURAÇÃO
  // ========================================
  config: {
    touchFeedback: true,
    hapticFeedback: true,
    pullToRefresh: true,
    swipeThreshold: 50
  },
  
  // ========================================
  // TOAST
  // ========================================
  toast(message, type = 'info', duration = 2500) {
    const toast = document.getElementById('mToast');
    if (!toast) return;
    
    toast.textContent = message;
    toast.className = 'm-toast ' + type + ' show';
    
    if (this.config.hapticFeedback) this.haptic('light');
    
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  },
  
  success(msg) { this.toast(msg, 'success'); },
  error(msg) { this.toast(msg, 'error', 4000); },
  warning(msg) { this.toast(msg, 'warning'); },
  
  // ========================================
  // HAPTIC FEEDBACK
  // ========================================
  haptic(type = 'light') {
    if (!this.config.hapticFeedback || !('vibrate' in navigator)) return;
    
    const patterns = {
      light: [10],
      medium: [20],
      heavy: [30],
      success: [10, 50, 10],
      error: [50, 30, 50]
    };
    
    navigator.vibrate(patterns[type] || patterns.light);
  },
  
  // ========================================
  // BOTTOM SHEET
  // ========================================
  openSheet(title, content) {
    const overlay = document.getElementById('mSheetOverlay');
    const titleEl = document.getElementById('mSheetTitle');
    const bodyEl = document.getElementById('mSheetBody');
    
    if (titleEl) titleEl.textContent = title;
    if (bodyEl) bodyEl.innerHTML = typeof content === 'string' ? content : '';
    if (overlay) overlay.classList.add('active');
    
    this.haptic('light');
    
    // Prevenir scroll do body
    document.body.style.overflow = 'hidden';
  },
  
  closeSheet() {
    const overlay = document.getElementById('mSheetOverlay');
    if (overlay) overlay.classList.remove('active');
    document.body.style.overflow = '';
  },
  
  // ========================================
  // LOADING
  // ========================================
  _loadingEl: null,
  
  showLoading(message = 'Carregando...') {
    if (!this._loadingEl) {
      this._loadingEl = document.createElement('div');
      this._loadingEl.className = 'm-sheet-overlay';
      this._loadingEl.innerHTML = `
        <div class="m-loading" style="background:var(--m-bg-card);padding:32px;border-radius:var(--m-radius-lg);">
          <div class="m-spinner"></div>
          <div class="m-loading-text">${message}</div>
        </div>
      `;
      document.body.appendChild(this._loadingEl);
    } else {
      this._loadingEl.querySelector('.m-loading-text').textContent = message;
    }
    this._loadingEl.classList.add('active');
    document.body.style.overflow = 'hidden';
  },
  
  hideLoading() {
    if (this._loadingEl) {
      this._loadingEl.classList.remove('active');
      document.body.style.overflow = '';
    }
  },
  
  // ========================================
  // PULL TO REFRESH
  // ========================================
  initPullToRefresh(callback) {
    if (!this.config.pullToRefresh) return;
    
    let startY = 0;
    let pulling = false;
    const threshold = 80;
    
    const content = document.querySelector('.m-content');
    if (!content) return;
    
    // Criar indicador
    let indicator = document.querySelector('.m-pull-indicator');
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.className = 'm-pull-indicator';
      indicator.innerHTML = '<div class="m-spinner" style="width:24px;height:24px;"></div>';
      document.body.appendChild(indicator);
    }
    
    content.addEventListener('touchstart', (e) => {
      if (content.scrollTop === 0) {
        startY = e.touches[0].pageY;
        pulling = true;
      }
    }, { passive: true });
    
    content.addEventListener('touchmove', (e) => {
      if (!pulling) return;
      
      const currentY = e.touches[0].pageY;
      const diff = currentY - startY;
      
      if (diff > 0 && diff < threshold * 1.5) {
        indicator.classList.add('pulling');
        indicator.style.transform = `translateX(-50%) translateY(${Math.min(diff * 0.5, 40)}px)`;
      }
    }, { passive: true });
    
    content.addEventListener('touchend', () => {
      if (!pulling) return;
      pulling = false;
      
      const transform = indicator.style.transform;
      const match = transform.match(/translateY\((\d+)px\)/);
      const pullDistance = match ? parseInt(match[1]) : 0;
      
      if (pullDistance >= 30) {
        indicator.classList.add('refreshing');
        this.haptic('medium');
        
        if (callback) {
          callback().finally(() => {
            indicator.classList.remove('pulling', 'refreshing');
            indicator.style.transform = 'translateX(-50%) translateY(-60px)';
          });
        }
      } else {
        indicator.classList.remove('pulling');
        indicator.style.transform = 'translateX(-50%) translateY(-60px)';
      }
    }, { passive: true });
  },
  
  // ========================================
  // SWIPE ACTIONS
  // ========================================
  initSwipeActions(container) {
    const items = container.querySelectorAll('.m-swipe-container');
    
    items.forEach(item => {
      const content = item.querySelector('.m-swipe-content');
      const actions = item.querySelector('.m-swipe-actions');
      if (!content || !actions) return;
      
      let startX = 0;
      let currentX = 0;
      let isDragging = false;
      const maxSwipe = actions.offsetWidth;
      
      content.addEventListener('touchstart', (e) => {
        startX = e.touches[0].pageX;
        isDragging = true;
        content.style.transition = 'none';
      }, { passive: true });
      
      content.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        
        currentX = e.touches[0].pageX;
        const diff = startX - currentX;
        
        if (diff > 0 && diff <= maxSwipe) {
          content.style.transform = `translateX(-${diff}px)`;
        }
      }, { passive: true });
      
      content.addEventListener('touchend', () => {
        isDragging = false;
        content.style.transition = 'transform 0.2s ease';
        
        const diff = startX - currentX;
        
        if (diff > this.config.swipeThreshold) {
          content.style.transform = `translateX(-${maxSwipe}px)`;
          this.haptic('light');
        } else {
          content.style.transform = 'translateX(0)';
        }
      }, { passive: true });
      
      // Fechar ao clicar fora
      document.addEventListener('touchstart', (e) => {
        if (!item.contains(e.target)) {
          content.style.transform = 'translateX(0)';
        }
      }, { passive: true });
    });
  },
  
  // ========================================
  // NAVEGAÇÃO
  // ========================================
  setActiveNav(id) {
    document.querySelectorAll('.m-nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.nav === id);
    });
  },
  
  // ========================================
  // BACKEND CALLS
  // ========================================
  async call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [fn](...args);
    });
  },
  
  async callWithLoading(fn, message = 'Carregando...', ...args) {
    this.showLoading(message);
    try {
      const result = await this.call(fn, ...args);
      this.hideLoading();
      return result;
    } catch (error) {
      this.hideLoading();
      this.error('Erro ao processar');
      throw error;
    }
  },
  
  // ========================================
  // FORMATADORES
  // ========================================
  format: {
    currency(value) {
      if (value == null) return '-';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    },
    
    date(value) {
      if (!value) return '-';
      const d = new Date(value);
      return d.toLocaleDateString('pt-BR');
    },
    
    dateTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    },
    
    relative(value) {
      if (!value) return '-';
      const d = new Date(value);
      const now = new Date();
      const diff = Math.floor((now - d) / 1000);
      
      if (diff < 60) return 'Agora';
      if (diff < 3600) return `${Math.floor(diff / 60)}min`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
      if (diff < 604800) return `${Math.floor(diff / 86400)}d`;
      return this.date(value);
    }
  },
  
  // ========================================
  // INICIALIZAÇÃO
  // ========================================
  init() {
    // Fechar sheet ao clicar no overlay
    const overlay = document.getElementById('mSheetOverlay');
    if (overlay) {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) this.closeSheet();
      });
    }
    
    // Touch feedback em botões
    if (this.config.touchFeedback) {
      document.querySelectorAll('.m-btn, .m-menu-item, .m-list-item, .m-card-interactive').forEach(el => {
        el.addEventListener('touchstart', () => this.haptic('light'), { passive: true });
      });
    }
    
    // Navegação bottom nav
    document.querySelectorAll('.m-nav-item').forEach(item => {
      item.addEventListener('click', () => {
        this.setActiveNav(item.dataset.nav);
        this.haptic('light');
      });
    });
    
    // Prevenir zoom em double-tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
    
    console.log('📱 MobileS20 inicializado');
  }
};

// Auto-inicializar
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => MobileS20.init());
} else {
  MobileS20.init();
}

// Aliases globais
const mToast = (msg, type) => MobileS20.toast(msg, type);
const mSuccess = (msg) => MobileS20.success(msg);
const mError = (msg) => MobileS20.error(msg);
const mLoading = (msg) => MobileS20.showLoading(msg);
const mHideLoading = () => MobileS20.hideLoading();
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
