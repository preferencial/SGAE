<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    /* ============================================
       DESIGN SYSTEM - COMPONENTES APRIMORADOS
       ============================================ */
    
    :root {
      /* Cores principais */
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-light: #e8f0fe;
      --secondary: #5f6368;
      --success: #1e8e3e;
      --success-light: #e6f4ea;
      --warning: #f9ab00;
      --warning-light: #fef7e0;
      --error: #d93025;
      --error-light: #fce8e6;
      --info: #1a73e8;
      --info-light: #e8f0fe;
      
      /* Neutros */
      --white: #ffffff;
      --gray-50: #f8f9fa;
      --gray-100: #f1f3f4;
      --gray-200: #e8eaed;
      --gray-300: #dadce0;
      --gray-400: #bdc1c6;
      --gray-500: #9aa0a6;
      --gray-600: #80868b;
      --gray-700: #5f6368;
      --gray-800: #3c4043;
      --gray-900: #202124;
      
      /* Tipografia */
      --font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      
      /* Espaçamento */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      
      /* Bordas */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      
      /* Sombras */
      --shadow-sm: 0 1px 2px rgba(60, 64, 67, 0.1);
      --shadow-md: 0 2px 6px rgba(60, 64, 67, 0.15);
      --shadow-lg: 0 4px 12px rgba(60, 64, 67, 0.2);
      
      /* Transições */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }
    
    /* Reset básico */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--gray-800);
      background: var(--gray-50);
      line-height: 1.5;
    }
    
    /* ============================================
       BOTÕES
       ============================================ */
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      font-family: inherit;
      font-size: var(--font-size-sm);
      font-weight: 500;
      line-height: 1.5;
      text-decoration: none;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }
    
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      box-shadow: var(--shadow-md);
    }
    
    .btn-secondary {
      background: var(--white);
      color: var(--primary);
      border: 1px solid var(--gray-300);
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    
    .btn-success {
      background: var(--success);
      color: var(--white);
    }
    
    .btn-danger {
      background: var(--error);
      color: var(--white);
    }
    
    .btn-ghost {
      background: transparent;
      color: var(--gray-700);
    }
    
    .btn-ghost:hover:not(:disabled) {
      background: var(--gray-100);
    }
    
    .btn-sm {
      padding: var(--spacing-xs) var(--spacing-sm);
      font-size: var(--font-size-xs);
    }
    
    .btn-lg {
      padding: var(--spacing-md) var(--spacing-lg);
      font-size: var(--font-size-base);
    }
    
    .btn-icon {
      padding: var(--spacing-sm);
      border-radius: var(--radius-full);
    }
    
    /* ============================================
       FORMULÁRIOS
       ============================================ */
    
    .form-group {
      margin-bottom: var(--spacing-md);
    }
    
    .form-label {
      display: block;
      margin-bottom: var(--spacing-xs);
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--gray-700);
    }
    
    .form-label.required::after {
      content: ' *';
      color: var(--error);
    }
    
    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: var(--spacing-sm) var(--spacing-md);
      font-family: inherit;
      font-size: var(--font-size-base);
      color: var(--gray-800);
      background: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    
    .form-input.error,
    .form-select.error,
    .form-textarea.error {
      border-color: var(--error);
    }
    
    .form-input.error:focus,
    .form-select.error:focus,
    .form-textarea.error:focus {
      box-shadow: 0 0 0 2px var(--error-light);
    }
    
    .form-error {
      margin-top: var(--spacing-xs);
      font-size: var(--font-size-xs);
      color: var(--error);
    }
    
    .form-hint {
      margin-top: var(--spacing-xs);
      font-size: var(--font-size-xs);
      color: var(--gray-600);
    }
    
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    
    /* ============================================
       CARDS
       ============================================ */
    
    .card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    
    .card-header {
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--gray-200);
    }
    
    .card-title {
      font-size: var(--font-size-lg);
      font-weight: 500;
      color: var(--gray-900);
    }
    
    .card-body {
      padding: var(--spacing-lg);
    }
    
    .card-footer {
      padding: var(--spacing-md) var(--spacing-lg);
      border-top: 1px solid var(--gray-200);
      background: var(--gray-50);
    }
    
    /* ============================================
       ALERTAS
       ============================================ */
    
    .alert {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
    }
    
    .alert-success {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid var(--success);
    }
    
    .alert-warning {
      background: var(--warning-light);
      color: #b45309;
      border: 1px solid var(--warning);
    }
    
    .alert-error {
      background: var(--error-light);
      color: var(--error);
      border: 1px solid var(--error);
    }
    
    .alert-info {
      background: var(--info-light);
      color: var(--info);
      border: 1px solid var(--info);
    }
    
    .alert-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
    }
    
    .alert-content {
      flex: 1;
    }
    
    .alert-title {
      font-weight: 500;
      margin-bottom: var(--spacing-xs);
    }
    
    .alert-dismiss {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.7;
    }
    
    .alert-dismiss:hover {
      opacity: 1;
    }
    
    /* ============================================
       TABELAS
       ============================================ */
    
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    
    .table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
    }
    
    .table th,
    .table td {
      padding: var(--spacing-sm) var(--spacing-md);
      text-align: left;
      border-bottom: 1px solid var(--gray-200);
    }
    
    .table th {
      font-weight: 500;
      color: var(--gray-700);
      background: var(--gray-50);
      white-space: nowrap;
    }
    
    .table tbody tr:hover {
      background: var(--gray-50);
    }
    
    .table tbody tr:last-child td {
      border-bottom: none;
    }
    
    .table-sortable th {
      cursor: pointer;
      user-select: none;
    }
    
    .table-sortable th:hover {
      background: var(--gray-100);
    }
    
    /* ============================================
       BADGES
       ============================================ */
    
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: var(--font-size-xs);
      font-weight: 500;
      border-radius: var(--radius-full);
    }
    
    .badge-primary {
      background: var(--primary-light);
      color: var(--primary);
    }
    
    .badge-success {
      background: var(--success-light);
      color: var(--success);
    }
    
    .badge-warning {
      background: var(--warning-light);
      color: #b45309;
    }
    
    .badge-error {
      background: var(--error-light);
      color: var(--error);
    }
    
    .badge-gray {
      background: var(--gray-200);
      color: var(--gray-700);
    }
    
    /* ============================================
       LOADING / SPINNER
       ============================================ */
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--gray-300);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    .spinner-sm {
      width: 16px;
      height: 16px;
    }
    
    .spinner-lg {
      width: 32px;
      height: 32px;
      border-width: 3px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      z-index: 1000;
    }
    
    .loading-content {
      text-align: center;
    }
    
    .loading-text {
      margin-top: var(--spacing-md);
      color: var(--gray-600);
    }
    
    /* ============================================
       MODAL
       ============================================ */
    
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-normal);
    }
    
    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform var(--transition-normal);
    }
    
    .modal-backdrop.active .modal {
      transform: scale(1);
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--gray-200);
    }
    
    .modal-title {
      font-size: var(--font-size-lg);
      font-weight: 500;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--gray-500);
      line-height: 1;
    }
    
    .modal-close:hover {
      color: var(--gray-800);
    }
    
    .modal-body {
      padding: var(--spacing-lg);
      overflow-y: auto;
      max-height: 60vh;
    }
    
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: var(--spacing-sm);
      padding: var(--spacing-md) var(--spacing-lg);
      border-top: 1px solid var(--gray-200);
      background: var(--gray-50);
    }
    
    /* ============================================
       TOAST NOTIFICATIONS
       ============================================ */
    
    .toast-container {
      position: fixed;
      top: var(--spacing-lg);
      right: var(--spacing-lg);
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }
    
    .toast {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      min-width: 300px;
      max-width: 400px;
      animation: slideIn 0.3s ease;
    }
    
    .toast.removing {
      animation: slideOut 0.3s ease forwards;
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes slideOut {
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    
    .toast-icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
    }
    
    .toast-success .toast-icon { color: var(--success); }
    .toast-error .toast-icon { color: var(--error); }
    .toast-warning .toast-icon { color: var(--warning); }
    .toast-info .toast-icon { color: var(--info); }
    
    .toast-content {
      flex: 1;
    }
    
    .toast-title {
      font-weight: 500;
      margin-bottom: 2px;
    }
    
    .toast-message {
      font-size: var(--font-size-sm);
      color: var(--gray-600);
    }
    
    /* ============================================
       PAGINAÇÃO
       ============================================ */
    
    .pagination {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    
    .pagination-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 var(--spacing-sm);
      background: var(--white);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .pagination-btn:hover:not(:disabled) {
      background: var(--gray-100);
      border-color: var(--gray-400);
    }
    
    .pagination-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }
    
    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .pagination-info {
      font-size: var(--font-size-sm);
      color: var(--gray-600);
      margin: 0 var(--spacing-sm);
    }
    
    /* ============================================
       UTILITÁRIOS
       ============================================ */
    
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-muted { color: var(--gray-600); }
    .text-success { color: var(--success); }
    .text-error { color: var(--error); }
    .text-warning { color: var(--warning); }
    
    .mt-1 { margin-top: var(--spacing-xs); }
    .mt-2 { margin-top: var(--spacing-sm); }
    .mt-3 { margin-top: var(--spacing-md); }
    .mt-4 { margin-top: var(--spacing-lg); }
    
    .mb-1 { margin-bottom: var(--spacing-xs); }
    .mb-2 { margin-bottom: var(--spacing-sm); }
    .mb-3 { margin-bottom: var(--spacing-md); }
    .mb-4 { margin-bottom: var(--spacing-lg); }
    
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .gap-2 { gap: var(--spacing-sm); }
    .gap-3 { gap: var(--spacing-md); }
    
    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  


/* codex-school-community-ux: ajustes finos para uso recorrente por comunidade escolar */
:root {
  --codex-school-focus: #ffd166;
  --codex-school-touch: 44px;
  --codex-school-radius: 8px;
  --codex-school-field-radius: 7px;
  --codex-school-form-gap: 14px;
  --codex-school-field-border: rgba(120, 132, 156, 0.45);
  --codex-school-field-bg: rgba(255, 255, 255, 0.96);
  --codex-school-field-text: #1f2937;
  --codex-school-muted-text: #64748b;
  --codex-school-soft-surface: rgba(248, 250, 252, 0.82);
  --codex-school-safe-bottom: max(16px, env(safe-area-inset-bottom));
}

:where(html) {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

:where(body) {
  overscroll-behavior-y: contain;
}

:where(p, li, dd, dt, blockquote, figcaption, label, td, th) {
  line-height: 1.5;
}

:where(main, .main, .content, .page, .app, .app-shell, .container, .dashboard, .workspace) {
  padding-bottom: var(--codex-school-safe-bottom);
}

:where(a, button, .btn, .button, [role="button"], input, select, textarea, summary) {
  min-height: var(--codex-school-touch);
  touch-action: manipulation;
}

:where(button, .btn, .button, [role="button"], input[type="submit"], input[type="button"]) {
  border-radius: var(--codex-school-radius) !important;
  font-weight: 700;
}

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--codex-school-focus) !important;
  outline-offset: 3px !important;
}

:where(label) {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  color: var(--codex-gentle-muted, var(--text-muted, var(--codex-school-muted-text)));
  font-weight: 700;
}

:where(form) {
  border-radius: var(--codex-school-radius) !important;
}

:where(fieldset) {
  border-radius: var(--codex-school-radius) !important;
  border-color: var(--codex-school-field-border);
}

:where(legend) {
  padding-inline: 6px;
  font-weight: 700;
}

:where(.form-group, .input-field, .field, .form-field, .control-group) {
  margin-bottom: var(--codex-school-form-gap);
}

:where(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea) {
  width: min(100%, 100%);
  border-radius: var(--codex-school-field-radius) !important;
  border-color: var(--codex-school-field-border) !important;
  background-color: var(--input-bg, var(--field-bg, var(--codex-school-field-bg)));
  color: var(--input-text, var(--text-color, var(--codex-school-field-text)));
  font-size: 16px !important;
}

:where(input::placeholder, textarea::placeholder) {
  color: var(--placeholder-color, #94a3b8);
  opacity: 1;
}

:where(input[required], select[required], textarea[required]) {
  border-left: 3px solid var(--codex-gentle-primary-strong, #aecbfa) !important;
}

:where(input:disabled, select:disabled, textarea:disabled, button:disabled, [aria-disabled="true"]) {
  cursor: not-allowed !important;
  opacity: 0.68;
}

:where(.help, .hint, .help-text, .form-help, small) {
  line-height: 1.45;
  color: var(--codex-gentle-muted, var(--text-muted, var(--codex-school-muted-text)));
}

:where(.actions, .form-actions, .button-row, .toolbar, .topbar, nav, [role="toolbar"]) {
  gap: 8px;
}

:where(.actions, .form-actions, .button-row) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
}

:where(.actions, .form-actions, .button-row) > :where(button, .btn, .button, [role="button"]) {
  flex: 1 1 148px;
}

:where(.card, .panel, .box, .tile, .item, .list-item, .action-card) {
  border-radius: var(--codex-school-radius) !important;
}

:where(.section, .surface, .widget, .modal-content, .dialog-content, .drawer, .dropdown, .menu) {
  border-radius: var(--codex-school-radius) !important;
}

:where(.filters, .search-panel, .form-section) {
  border-radius: var(--codex-school-radius) !important;
  background: var(--codex-school-soft-surface);
}

:where(table) {
  border-collapse: collapse;
}

:where(table, .table, .data-table) {
  max-width: 100%;
}

:where(.table-wrap, .table-wrapper, .table-container, .responsive-table) {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

:where(th, td) {
  vertical-align: top;
}

:where(.toast, .alert, .notice, .snackbar, [role="status"], [role="alert"]) {
  border-radius: var(--codex-school-radius) !important;
  line-height: 1.45;
}

@media (max-width: 420px) {
  :where(body) {
    font-size: 16px;
  }

  :where(h1) {
    font-size: clamp(1.55rem, 1.35rem + 1vw, 2rem) !important;
    line-height: 1.15 !important;
  }

  :where(h2) {
    font-size: clamp(1.25rem, 1.1rem + 0.8vw, 1.55rem) !important;
    line-height: 1.2 !important;
  }

  :where(.toolbar, .topbar, nav, [role="toolbar"]) {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }

  :where(.hide-mobile, .desktop-only) {
    display: none !important;
  }
}
</style>
  <style id="codex-mobile-a11y">

<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());

        <p class="loading-text">Carregando...</p>
      </div>
    </div>
  </template>

  
  <script>
    /**
     * Sistema de Componentes UI Aprimorado
     * @namespace UIComponents
     */
    var UIComponents = (function() {
      
      // ============================================
      // TOAST NOTIFICATIONS
      // ============================================
      
      var toastContainer = null;
      
      function initToastContainer() {
        if (!toastContainer) {
          toastContainer = document.getElementById('toast-container');
          if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.id = 'toast-container';
            toastContainer.className = 'toast-container';
            document.body.appendChild(toastContainer);
          }
        }
        return toastContainer;
      }
      
      /**
       * Exibe uma notificação toast
       * @param {Object} options - Opções do toast
       * @param {string} options.type - Tipo: success, error, warning, info
       * @param {string} options.title - Título
       * @param {string} options.message - Mensagem
       * @param {number} [options.duration=5000] - Duração em ms
       */
      function showToast(options) {
        var container = initToastContainer();
        
        var icons = {
          success: '✓',
          error: '✕',
          warning: '⚠',
          info: 'ℹ'
        };
        
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + (options.type || 'info');
        toast.innerHTML = 
          '<span class="toast-icon">' + (icons[options.type] || icons.info) + '</span>' +
          '<div class="toast-content">' +
            (options.title ? '<div class="toast-title">' + escapeHtml(options.title) + '</div>' : '') +
            '<div class="toast-message">' + escapeHtml(options.message || '') + '</div>' +
          '</div>' +
          '<button class="alert-dismiss" onclick="this.parentElement.remove()">×</button>';
        
        container.appendChild(toast);
        
        // Auto-remove
        var duration = options.duration || 5000;
        setTimeout(function() {
          toast.classList.add('removing');
          setTimeout(function() {
            if (toast.parentElement) {
              toast.remove();
            }
          }, 300);
        }, duration);
        
        return toast;
      }
      
      // Atalhos
      function toastSuccess(message, title) {
        return showToast({ type: 'success', title: title || 'Sucesso', message: message });
      }
      
      function toastError(message, title) {
        return showToast({ type: 'error', title: title || 'Erro', message: message, duration: 8000 });
      }
      
      function toastWarning(message, title) {
        return showToast({ type: 'warning', title: title || 'Atenção', message: message });
      }
      
      function toastInfo(message, title) {
        return showToast({ type: 'info', title: title, message: message });
      }
      
      // ============================================
      // LOADING
      // ============================================
      
      var loadingOverlay = null;
      
      /**
       * Exibe overlay de loading
       * @param {string} [message] - Mensagem opcional
       */
      function showLoading(message) {
        if (loadingOverlay) return;
        
        loadingOverlay = document.createElement('div');
        loadingOverlay.className = 'loading-overlay';
        loadingOverlay.innerHTML = 
          '<div class="loading-content">' +
            '<div class="spinner spinner-lg"></div>' +
            '<p class="loading-text">' + escapeHtml(message || 'Carregando...') + '</p>' +
          '</div>';
        
        document.body.appendChild(loadingOverlay);
        
        // Fade in
        requestAnimationFrame(function() {
          loadingOverlay.style.opacity = '1';
        });
      }
      
      /**
       * Esconde overlay de loading
       */
      function hideLoading() {
        if (!loadingOverlay) return;
        
        loadingOverlay.style.opacity = '0';
        setTimeout(function() {
          if (loadingOverlay && loadingOverlay.parentElement) {
            loadingOverlay.remove();
          }
          loadingOverlay = null;
        }, 200);
      }
      
      // ============================================
      // MODAL
      // ============================================
      
      var activeModal = null;
      
      /**
       * Exibe um modal
       * @param {Object} options - Opções do modal
       * @param {string} options.title - Título
       * @param {string} options.content - Conteúdo HTML
       * @param {Array} [options.buttons] - Botões do footer
       * @param {Function} [options.onClose] - Callback ao fechar
       */
      function showModal(options) {
        closeModal(); // Fecha modal anterior se existir
        
        var backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        
        var buttonsHtml = '';
        if (options.buttons && options.buttons.length > 0) {
          buttonsHtml = '<div class="modal-footer">';
          options.buttons.forEach(function(btn, index) {
            buttonsHtml += '<button class="btn ' + (btn.class || 'btn-secondary') + '" data-btn-index="' + index + '">' + 
              escapeHtml(btn.text) + '</button>';
          });
          buttonsHtml += '</div>';
        }
        
        backdrop.innerHTML = 
          '<div class="modal">' +
            '<div class="modal-header">' +
              '<h3 class="modal-title">' + escapeHtml(options.title || '') + '</h3>' +
              '<button class="modal-close" data-close>&times;</button>' +
            '</div>' +
            '<div class="modal-body">' + (options.content || '') + '</div>' +
            buttonsHtml +
          '</div>';
        
        document.body.appendChild(backdrop);
        
        // Event listeners
        backdrop.querySelector('[data-close]').addEventListener('click', closeModal);
        backdrop.addEventListener('click', function(e) {
          if (e.target === backdrop) closeModal();
        });
        
        // Button handlers
        if (options.buttons) {
          options.buttons.forEach(function(btn, index) {
            var btnEl = backdrop.querySelector('[data-btn-index="' + index + '"]');
            if (btnEl && btn.onClick) {
              btnEl.addEventListener('click', function() {
                btn.onClick(closeModal);
              });
            }
          });
        }
        
        // Keyboard
        document.addEventListener('keydown', handleModalKeydown);
        
        // Animate in
        requestAnimationFrame(function() {
          backdrop.classList.add('active');
        });
        
        activeModal = { backdrop: backdrop, onClose: options.onClose };
        
        return backdrop;
      }
      
      function handleModalKeydown(e) {
        if (e.key === 'Escape') {
          closeModal();
        }
      }
      
      /**
       * Fecha o modal ativo
       */
      function closeModal() {
        if (!activeModal) return;
        
        document.removeEventListener('keydown', handleModalKeydown);
        
        activeModal.backdrop.classList.remove('active');
        
        setTimeout(function() {
          if (activeModal && activeModal.backdrop.parentElement) {
            activeModal.backdrop.remove();
          }
          if (activeModal && activeModal.onClose) {
            activeModal.onClose();
          }
          activeModal = null;
        }, 250);
      }
      
      /**
       * Modal de confirmação
       */
      function confirm(message, options) {
        options = options || {};
        
        return new Promise(function(resolve) {
          showModal({
            title: options.title || 'Confirmação',
            content: '<p>' + escapeHtml(message) + '</p>',
            buttons: [
              {
                text: options.cancelText || 'Cancelar',
                class: 'btn-secondary',
                onClick: function(close) {
                  close();
                  resolve(false);
                }
              },
              {
                text: options.confirmText || 'Confirmar',
                class: options.danger ? 'btn-danger' : 'btn-primary',
                onClick: function(close) {
                  close();
                  resolve(true);
                }
              }
            ]
          });
        });
      }
      
      /**
       * Modal de alerta
       */
      function alert(message, options) {
        options = options || {};
        
        return new Promise(function(resolve) {
          showModal({
            title: options.title || 'Aviso',
            content: '<p>' + escapeHtml(message) + '</p>',
            buttons: [
              {
                text: 'OK',
                class: 'btn-primary',
                onClick: function(close) {
                  close();
                  resolve();
                }
              }
            ]
          });
        });
      }
      
      // ============================================
      // FORMULÁRIOS
      // ============================================
      
      /**
       * Valida um formulário
       * @param {HTMLFormElement} form - Elemento do formulário
       * @returns {Object} { valid: boolean, errors: Object, data: Object }
       */
      function validateForm(form) {
        var data = {};
        var errors = {};
        var valid = true;
        
        // Limpa erros anteriores
        form.querySelectorAll('.form-error').forEach(function(el) {
          el.remove();
        });
        form.querySelectorAll('.error').forEach(function(el) {
          el.classList.remove('error');
        });
        
        // Coleta e valida campos
        var inputs = form.querySelectorAll('input, select, textarea');
        inputs.forEach(function(input) {
          var name = input.name || input.id;
          if (!name) return;
          
          var value = input.type === 'checkbox' ? input.checked : input.value.trim();
          data[name] = value;
          
          // Validação required
          if (input.required && !value) {
            errors[name] = 'Campo obrigatório';
            valid = false;
            showFieldError(input, errors[name]);
            return;
          }
          
          // Validação de tipo
          if (value) {
            if (input.type === 'email' && !isValidEmail(value)) {
              errors[name] = 'Email inválido';
              valid = false;
              showFieldError(input, errors[name]);
            } else if (input.dataset.validate === 'cnpj' && !isValidCNPJ(value)) {
              errors[name] = 'CNPJ inválido';
              valid = false;
              showFieldError(input, errors[name]);
            } else if (input.minLength && value.length < input.minLength) {
              errors[name] = 'Mínimo ' + input.minLength + ' caracteres';
              valid = false;
              showFieldError(input, errors[name]);
            }
          }
        });
        
        return { valid: valid, errors: errors, data: data };
      }
      
      function showFieldError(input, message) {
        input.classList.add('error');
        var errorEl = document.createElement('div');
        errorEl.className = 'form-error';
        errorEl.textContent = message;
        input.parentElement.appendChild(errorEl);
      }
      
      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }
      
      function isValidCNPJ(cnpj) {
        cnpj = cnpj.replace(/[^\d]/g, '');
        return cnpj.length === 14;
      }
      
      // ============================================
      // TABELA DINÂMICA
      // ============================================
      
      /**
       * Cria uma tabela dinâmica com dados
       * @param {Object} options - Opções da tabela
       * @param {Array} options.columns - Definição das colunas
       * @param {Array} options.data - Dados
       * @param {Function} [options.onRowClick] - Callback ao clicar em linha
       */
      function createTable(options) {
        var table = document.createElement('table');
        table.className = 'table' + (options.sortable ? ' table-sortable' : '');
        
        // Header
        var thead = document.createElement('thead');
        var headerRow = document.createElement('tr');
        
        options.columns.forEach(function(col) {
          var th = document.createElement('th');
          th.textContent = col.label || col.field;
          th.dataset.field = col.field;
          if (col.width) th.style.width = col.width;
          headerRow.appendChild(th);
        });
        
        thead.appendChild(headerRow);
        table.appendChild(thead);
        
        // Body
        var tbody = document.createElement('tbody');
        
        options.data.forEach(function(row, rowIndex) {
          var tr = document.createElement('tr');
          tr.dataset.index = rowIndex;
          
          options.columns.forEach(function(col) {
            var td = document.createElement('td');
            var value = row[col.field];
            
            if (col.render) {
              td.innerHTML = col.render(value, row, rowIndex);
            } else if (col.type === 'date' && value) {
              td.textContent = formatDate(value);
            } else if (col.type === 'currency' && value !== undefined) {
              td.textContent = formatCurrency(value);
            } else if (col.type === 'badge') {
              td.innerHTML = '<span class="badge badge-' + (col.badgeClass ? col.badgeClass(value) : 'gray') + '">' + 
                escapeHtml(value || '') + '</span>';
            } else {
              td.textContent = value !== undefined && value !== null ? value : '';
            }
            
            tr.appendChild(td);
          });
          
          if (options.onRowClick) {
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function() {
              options.onRowClick(row, rowIndex);
            });
          }
          
          tbody.appendChild(tr);
        });
        
        table.appendChild(tbody);
        
        return table;
      }
      
      // ============================================
      // PAGINAÇÃO
      // ============================================
      
      /**
       * Cria controles de paginação
       * @param {Object} options - Opções
       * @param {number} options.currentPage - Página atual
       * @param {number} options.totalPages - Total de páginas
       * @param {Function} options.onPageChange - Callback de mudança
       */
      function createPagination(options) {
        var container = document.createElement('div');
        container.className = 'pagination';
        
        // Botão anterior
        var prevBtn = document.createElement('button');
        prevBtn.className = 'pagination-btn';
        prevBtn.innerHTML = '&laquo;';
        prevBtn.disabled = options.currentPage <= 1;
        prevBtn.addEventListener('click', function() {
          if (options.currentPage > 1) {
            options.onPageChange(options.currentPage - 1);
          }
        });
        container.appendChild(prevBtn);
        
        // Números de página
        var startPage = Math.max(1, options.currentPage - 2);
        var endPage = Math.min(options.totalPages, startPage + 4);
        
        for (var i = startPage; i <= endPage; i++) {
          var pageBtn = document.createElement('button');
          pageBtn.className = 'pagination-btn' + (i === options.currentPage ? ' active' : '');
          pageBtn.textContent = i;
          pageBtn.dataset.page = i;
          pageBtn.addEventListener('click', function() {
            options.onPageChange(parseInt(this.dataset.page));
          });
          container.appendChild(pageBtn);
        }
        
        // Botão próximo
        var nextBtn = document.createElement('button');
        nextBtn.className = 'pagination-btn';
        nextBtn.innerHTML = '&raquo;';
        nextBtn.disabled = options.currentPage >= options.totalPages;
        nextBtn.addEventListener('click', function() {
          if (options.currentPage < options.totalPages) {
            options.onPageChange(options.currentPage + 1);
          }
        });
        container.appendChild(nextBtn);
        
        return container;
      }
      
      // ============================================
      // UTILITÁRIOS
      // ============================================
      
      function escapeHtml(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      
      function formatDate(date) {
        if (!date) return '';
        var d = new Date(date);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('pt-BR');
      }
      
      function formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        }).format(value || 0);
      }
      
      // ============================================
      // API PÚBLICA
      // ============================================
      
      return {
        // Toasts
        showToast: showToast,
        toastSuccess: toastSuccess,
        toastError: toastError,
        toastWarning: toastWarning,
        toastInfo: toastInfo,
        
        // Loading
        showLoading: showLoading,
        hideLoading: hideLoading,
        
        // Modal
        showModal: showModal,
        closeModal: closeModal,
        confirm: confirm,
        alert: alert,
        
        // Formulários
        validateForm: validateForm,
        
        // Tabela
        createTable: createTable,
        createPagination: createPagination,
        
        // Utilitários
        escapeHtml: escapeHtml,
        formatDate: formatDate,
        formatCurrency: formatCurrency
      };
      
    })();
    
    // Aliases globais
    var UI = UIComponents;
  </script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
