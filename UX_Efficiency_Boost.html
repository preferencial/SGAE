<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * EfficientUX - Sistema de UX focado em eficiência
 */
const EfficientUX = {
  // ========================================
  // TOAST INSTANTÂNEO
  // ========================================
  toast(message, type = 'info', duration = 2500) {
    const toast = document.getElementById('instantToast');
    if (!toast) return;
    
    toast.className = 'instant-toast ' + type;
    toast.innerHTML = this.getToastIcon(type) + ' ' + message;
    toast.classList.add('show');
    
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  },
  
  getToastIcon(type) {
    const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
    return icons[type] || icons.info;
  },
  
  success(msg) { this.toast(msg, 'success'); },
  error(msg) { this.toast(msg, 'error', 4000); },
  warning(msg) { this.toast(msg, 'warning'); },
  info(msg) { this.toast(msg, 'info'); },
  
  // ========================================
  // QUICK FAB
  // ========================================
  toggleFab() {
    const fab = document.getElementById('quickFab');
    const icon = document.getElementById('fabIcon');
    fab.classList.toggle('open');
    icon.textContent = fab.classList.contains('open') ? '✕' : '⚡';
  },
  
  closeFab() {
    const fab = document.getElementById('quickFab');
    const icon = document.getElementById('fabIcon');
    fab.classList.remove('open');
    icon.textContent = '⚡';
  },
  
  // ========================================
  // COMMAND PALETTE
  // ========================================
  commands: [
    { id: 'nova-nf', icon: '📄', title: 'Nova Nota Fiscal', desc: 'Cadastrar nova NF', shortcut: ['Alt', 'N'] },
    { id: 'entrega', icon: '🚚', title: 'Registrar Entrega', desc: 'Nova entrega de alimentos', shortcut: ['Alt', 'E'] },
    { id: 'atestar', icon: '✅', title: 'Atestar', desc: 'Atestar notas fiscais', shortcut: ['Alt', 'A'] },
    { id: 'buscar-nf', icon: '🔍', title: 'Buscar NF', desc: 'Pesquisar nota fiscal', shortcut: ['Ctrl', 'F'] },
    { id: 'dashboard', icon: '📊', title: 'Dashboard', desc: 'Ir para o painel', shortcut: ['Alt', 'D'] },
    { id: 'relatorios', icon: '📈', title: 'Relatórios', desc: 'Gerar relatórios', shortcut: ['Alt', 'R'] },
    { id: 'config', icon: '⚙️', title: 'Configurações', desc: 'Ajustes do sistema' },
    { id: 'ajuda', icon: '❓', title: 'Ajuda', desc: 'Central de ajuda', shortcut: ['F1'] },
  ],
  
  selectedIndex: 0,
  filteredCommands: [],
  
  openCommandPalette() {
    this.closeFab();
    const overlay = document.getElementById('commandPalette');
    const search = document.getElementById('commandSearch');
    
    overlay.classList.add('active');
    search.value = '';
    search.focus();
    
    this.filteredCommands = [...this.commands];
    this.selectedIndex = 0;
    this.renderCommands();
    
    // Fechar ao clicar fora
    overlay.onclick = (e) => {
      if (e.target === overlay) this.closeCommandPalette();
    };
  },
  
  closeCommandPalette() {
    document.getElementById('commandPalette').classList.remove('active');
  },
  
  filterCommands(query) {
    query = query.toLowerCase().trim();
    if (!query) {
      this.filteredCommands = [...this.commands];
    } else {
      this.filteredCommands = this.commands.filter(cmd => 
        cmd.title.toLowerCase().includes(query) || 
        cmd.desc.toLowerCase().includes(query)
      );
    }
    this.selectedIndex = 0;
    this.renderCommands();
  },
  
  renderCommands() {
    const container = document.getElementById('commandResults');
    
    if (this.filteredCommands.length === 0) {
      container.innerHTML = '<div class="command-empty">Nenhum resultado encontrado</div>';
      return;
    }
    
    container.innerHTML = this.filteredCommands.map((cmd, i) => `
      <div class="command-item ${i === this.selectedIndex ? 'selected' : ''}" 
           onclick="EfficientUX.executeCommand('${cmd.id}')"
           onmouseenter="EfficientUX.selectedIndex = ${i}; EfficientUX.renderCommands();">
        <div class="command-item-icon">${cmd.icon}</div>
        <div class="command-item-content">
          <div class="command-item-title">${cmd.title}</div>
          <div class="command-item-desc">${cmd.desc}</div>
        </div>
        ${cmd.shortcut ? `
          <div class="command-item-shortcut">
            ${cmd.shortcut.map(k => `<span class="command-key">${k}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');
  },
  
  navigateCommands(direction) {
    if (direction === 'up') {
      this.selectedIndex = Math.max(0, this.selectedIndex - 1);
    } else {
      this.selectedIndex = Math.min(this.filteredCommands.length - 1, this.selectedIndex + 1);
    }
    this.renderCommands();
    
    // Scroll para item selecionado
    const selected = document.querySelector('.command-item.selected');
    if (selected) selected.scrollIntoView({ block: 'nearest' });
  },
  
  executeSelectedCommand() {
    if (this.filteredCommands[this.selectedIndex]) {
      this.executeCommand(this.filteredCommands[this.selectedIndex].id);
    }
  },
  
  executeCommand(id) {
    this.closeCommandPalette();
    this.action(id);
  },
  
  // ========================================
  // AÇÕES
  // ========================================
  action(id) {
    console.log('Ação executada:', id);
    
    // Callbacks customizáveis
    if (this.actionCallbacks && this.actionCallbacks[id]) {
      this.actionCallbacks[id]();
      return;
    }
    
    // Ações padrão (podem ser sobrescritas)
    switch(id) {
      case 'nova-nf':
        this.toast('Abrindo formulário de NF...', 'info');
        break;
      case 'entrega':
        this.toast('Abrindo registro de entrega...', 'info');
        break;
      case 'atestar':
        this.toast('Abrindo atesto...', 'info');
        break;
      case 'buscar-nf':
        this.openCommandPalette();
        break;
      case 'dashboard':
        this.toast('Indo para Dashboard...', 'info');
        break;
      case 'relatorios':
        this.toast('Abrindo relatórios...', 'info');
        break;
      case 'config':
        this.toast('Abrindo configurações...', 'info');
        break;
      case 'ajuda':
        this.toast('Abrindo ajuda...', 'info');
        break;
      default:
        this.toast('Ação: ' + id, 'info');
    }
  },
  
  // Registrar callbacks customizados
  onAction(id, callback) {
    if (!this.actionCallbacks) this.actionCallbacks = {};
    this.actionCallbacks[id] = callback;
  },
  
  // ========================================
  // SMART INPUT
  // ========================================
  validateInput(input, rules = {}) {
    const value = input.value.trim();
    let isValid = true;
    
    if (rules.required && !value) isValid = false;
    if (rules.minLength && value.length < rules.minLength) isValid = false;
    if (rules.maxLength && value.length > rules.maxLength) isValid = false;
    if (rules.pattern && !rules.pattern.test(value)) isValid = false;
    if (rules.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) isValid = false;
    if (rules.custom && !rules.custom(value)) isValid = false;
    
    input.classList.toggle('valid', isValid && value);
    input.classList.toggle('invalid', !isValid && value);
    
    return isValid;
  },
  
  // ========================================
  // DROPDOWN INTELIGENTE
  // ========================================
  initDropdowns() {
    document.querySelectorAll('.smart-dropdown').forEach(dropdown => {
      const trigger = dropdown.querySelector('.smart-dropdown-trigger');
      
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Fechar outros dropdowns
        document.querySelectorAll('.smart-dropdown.open').forEach(d => {
          if (d !== dropdown) d.classList.remove('open');
        });
        
        dropdown.classList.toggle('open');
        trigger.classList.toggle('open');
      });
      
      // Selecionar item
      dropdown.querySelectorAll('.smart-dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
          const value = item.dataset.value;
          const text = item.textContent.trim();
          
          // Atualizar seleção visual
          dropdown.querySelectorAll('.smart-dropdown-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          
          // Atualizar trigger
          const triggerText = trigger.querySelector('.dropdown-text');
          if (triggerText) triggerText.textContent = text;
          
          // Fechar
          dropdown.classList.remove('open');
          trigger.classList.remove('open');
          
          // Evento customizado
          dropdown.dispatchEvent(new CustomEvent('change', { detail: { value, text } }));
        });
      });
    });
    
    // Fechar ao clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.smart-dropdown.open').forEach(d => {
        d.classList.remove('open');
        d.querySelector('.smart-dropdown-trigger').classList.remove('open');
      });
    });
  },
  
  // ========================================
  // CHIP SELECT
  // ========================================
  initChipSelect() {
    document.querySelectorAll('.chip-select').forEach(container => {
      const isMultiple = container.dataset.multiple === 'true';
      
      container.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          if (!isMultiple) {
            container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
          }
          chip.classList.toggle('selected');
          
          // Coletar valores selecionados
          const selected = Array.from(container.querySelectorAll('.chip.selected'))
            .map(c => c.dataset.value);
          
          container.dispatchEvent(new CustomEvent('change', { detail: { selected } }));
        });
      });
    });
  },
  
  // ========================================
  // INICIALIZAÇÃO
  // ========================================
  init() {
    // Atalhos de teclado globais
    document.addEventListener('keydown', (e) => {
      // Ctrl+K ou Cmd+K para Command Palette
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        this.openCommandPalette();
      }
      
      // ESC para fechar
      if (e.key === 'Escape') {
        this.closeCommandPalette();
        this.closeFab();
      }
      
      // Navegação no Command Palette
      if (document.getElementById('commandPalette').classList.contains('active')) {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.navigateCommands('up');
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.navigateCommands('down');
        } else if (e.key === 'Enter') {
          e.preventDefault();
          this.executeSelectedCommand();
        }
      }
      
      // Atalhos Alt+
      if (e.altKey) {
        switch(e.key.toLowerCase()) {
          case 'n': e.preventDefault(); this.action('nova-nf'); break;
          case 'e': e.preventDefault(); this.action('entrega'); break;
          case 'a': e.preventDefault(); this.action('atestar'); break;
          case 'd': e.preventDefault(); this.action('dashboard'); break;
          case 'r': e.preventDefault(); this.action('relatorios'); break;
        }
      }
      
      // F1 para ajuda
      if (e.key === 'F1') {
        e.preventDefault();
        this.action('ajuda');
      }
    });
    
    // Busca no Command Palette
    const searchInput = document.getElementById('commandSearch');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        this.filterCommands(e.target.value);
      });
    }
    
    // Inicializar componentes
    this.initDropdowns();
    this.initChipSelect();
    
    console.log('✨ EfficientUX inicializado');
  }
};

// Auto-inicializar quando DOM estiver pronto
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => EfficientUX.init());
} else {
  EfficientUX.init();
}

// Helpers globais para uso rápido
function toast(msg, type) { EfficientUX.toast(msg, type); }
function toastSuccess(msg) { EfficientUX.success(msg); }
function toastError(msg) { EfficientUX.error(msg); }
function toastWarning(msg) { EfficientUX.warning(msg); }
</script>

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {
      delete button.dataset.codexSubmitLocked;
      button.disabled = false;
      button.removeAttribute('aria-disabled');
    }
  }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {
      event.preventDefault();
      return;
    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.dataset.codexSubmitting = 'true';
    form.setAttribute('aria-busy', 'true');

    var button = event.submitter || form.querySelector('button[type="submit"], input[type="submit"], button:not([type])');
    if (isElement(button) && !button.disabled && !button.hasAttribute('data-no-submit-lock')) {
      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);
  }, true);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {
      invalidFocusPending = false;
      if (!document.documentElement.contains(field)) return;
      try {
        field.scrollIntoView({ block: 'center', inline: 'nearest', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
        field.focus({ preventScroll: true });
      } catch (error) {
        field.focus();
      }
    }, 0);
  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
